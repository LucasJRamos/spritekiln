pxforge: 1
name: mine
kind: prop
size: 32                 # ~11 px disc + glow: 32 px leaves spare margin (density 0.040 like the rest)
directions: 1            # symmetric disc seen from above: 1 direction is enough
palette: [../../palettes/gothic.yaml, ../../palettes/huntress.yaml]
camera: {pitch: 38, scale: 0.040, center: [0, 0.05, 0]}
shadow: {rx: 6, ry: 2.2, alpha: 110}

brief:
  summary: the Huntress's mine (special); low disc of blackened steel with a gold rim and a light in the center
    that shows the state (off / amber = unarmed / red = armed)
  reference: no user art; same finish as her guns (blackened steel + gold)
  proportions: "diameter 0.38 (≈10-11 px on the ground with outline), height 0.12; the light is the brightest
    shape and sits on top"
  must_keep: [dark disc readable on the dark floor (outline + gold rim), clearly visible emissive center light,
    state read from the light color alone]
  simplify: [rivets and mechanism/trigger are dropped; the gold rim is the only detail]
  decisions:
    - "art proposal (the splash does not show the mine): domed disc, wide gold rim on top and a center lens"
    - "light channel: 0 = off (dark wine lens), 1 = amber (unarmed), 2 = red (armed); flare scales the light
      for the blink (the animator makes the cycle)"
    - "the same mine appears in the Huntress's left hand (huntress.yaml, channel mine_L) with the amber light"
    - "pixel-art-director review: gold bands [1,4], light r 0.06, core r 0.035. The core was moved toward the camera
      (c [0, 0.127, 0.028]) because it did not show inside the light sphere; this way the lit light is the brightest
      pixel and the state color still dominates (4 px of color + 2 warm px)"

materials:
  metal:      {ramp: gunmetal, bands: [1, 4]}
  gold:       {ramp: gold, bands: [1, 4]}
  lens:       {ramp: blood, bands: [0, 1], line: false}
  amber:      {ramp: mine_amber, emissive: true, band: 2, outline: false, glow: {color: "#ffa62a", mix: 0.5, radius: 1}}
  amber_core: {ramp: mine_amber, emissive: true, band: 4, outline: false}
  red:        {ramp: mine_red, emissive: true, band: 2, outline: false, glow: {color: "#ff2a2a", mix: 0.55, radius: 1}}
  red_core:   {ramp: mine_red, emissive: true, band: 4, outline: false}

channels:
  light: 1         # 0 = off | 1 = amber (unarmed) | 2 = red (armed)
  flare: 1         # light size (blink)

bones: {}

parts:
  body:
    material: metal
    blend: 0.02
    prims:
      - cylinder: {a: [0, 0.0, 0], b: [0, 0.06, 0], r: 0.19, round: 0.02}
      - ellipsoid: {c: [0, 0.06, 0], r: [0.12, 0.04, 0.12]}
      - cylinder: {a: [0, 0.08, 0], b: [0, 0.10, 0], r: 0.055, round: 0.01}
  ring:
    material: gold
    prims:
      - torus: {c: [0, 0.07, 0], R: 0.15, r: 0.026}
  lens:
    when: "light < 0.5"
    material: lens
    prims:
      - sphere: {c: [0, 0.10, 0], r: 0.045}
  light_amber:
    when: "light >= 0.5 and light < 1.5"
    material: amber
    prims:
      - sphere: {c: [0, 0.105, 0], r: "0.06*flare"}
  light_amber_core:
    when: "light >= 0.5 and light < 1.5"
    material: amber_core
    prims:
      - sphere: {c: "[0, 0.105 + 0.022*flare, 0.028*flare]", r: "0.035*flare"}   # moved toward camera: pierces the light sphere (~1 warm px)
  light_red:
    when: "light >= 1.5"
    material: red
    prims:
      - sphere: {c: [0, 0.105, 0], r: "0.06*flare"}
  light_red_core:
    when: "light >= 1.5"
    material: red_core
    prims:
      - sphere: {c: "[0, 0.105 + 0.022*flare, 0.028*flare]", r: "0.035*flare"}   # moved toward camera: pierces the light sphere (~1 warm px)

animations:
  # Mine states in the game (MineDef: arms in 0.4 s). light: 0 off | 1 amber | 2 red; flare = light size.
  arming:                  # unarmed (0.4 s in game): fast amber blink, 200 ms cycle
    frames: 4
    ms: 50
    channels:
      light: "[1, 1, 1, 0][f]"
      flare: "[1.25, 1.0, 0.75, 1.0][f]"
  armed:                   # armed: red, slower pulse with flare (flashes bright and fades), 500 ms cycle
    frames: 4
    ms: 125
    channels:
      light: 2
      flare: "[0.6, 1.45, 1.1, 0.8][f]"
  off:                     # off (dark wine lens), static
    loop: false
    keys:
      - {ms: 200, set: {light: 0}}
