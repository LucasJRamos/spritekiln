spritekiln: 1
# A kit: parts with params that any spec adds with `use: [{kit: hat, as: hat, at: head}]`.
# `spritekiln pose specs/kits/hat.yaml --dirs all` shows it on its host.
kit: hat
license: CC0-1.0
summary: a wide-brim hat with a round crown and a band, set high on the head and tipped back so the eyes show
host: humanoid
at: head
params:
  size: 1            # scale factor for bigger heads or hair (the template's head and hair fit at 1)
  brim: 0.30         # brim radius (head units: the template's hair reaches 0.19; over 0.3 it is wider than the shoulders)
  crown: 0.17        # crown height over the brim (head units)
  droop: 0            # how much lower the brim's edge hangs than its root (head units; negative: turned up)
  tilt: -0.45        # forward/back tilt (radians about the head's x): negative tips the front up (shows the eyes), positive shades them
  seat: 0.26         # height of the brim on the head (head units; the template's hair top is 0.33)
  band: true         # a cloth band around the foot of the crown

materials:
  leather: {ramp: bone, bands: [1, 3]}
  cloth: {ramp: cloth}

bones:
  hat: {parent: at, pos: "[0, seat, -0.05]", rot: "[tilt, 0, 0]", scale: size}

parts:
  crown:           # a round crown, a little narrower at the top: flat on top with a bevelled shoulder
    material: leather
    space: hat
    prims:
      - revolve: {c: [0, 0, 0], profile: {polygon: [[-0.205, -0.01], [0.205, -0.01], "[0.19, crown - 0.035]",
                                                     "[0.16, crown]", "[-0.16, crown]", "[-0.19, crown - 0.035]"],
                                         round: 0.01}}
    paint:
      - material: cloth
        stripes: {axis: y, at: ["0.035 - 3*(1 - band)"], width: 0.05}
  brim:            # a flat ring that hangs a little at the edge: one cross-section through the axis
    material: leather
    space: hat
    prims:
      - revolve: {c: [0, 0, 0], profile: {polygon: ["[-brim, -droop - 0.035]", [-0.15, -0.035], [0.15, -0.035],
                                                     "[brim, -droop - 0.035]", "[brim, -droop]", [0.15, 0],
                                                     [-0.15, 0], "[-brim, -droop]"], round: 0.008}}

sockets:
  top: {bone: hat, offset: "[0, crown, 0]"}   # the top of the crown
