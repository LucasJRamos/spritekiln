spritekiln: 1
# A kit: parts with params that any spec adds with `use: [{kit: pouch, as: pouch, at: pelvis}]`;
# `as: pouch_L, with: {angle: 1.15}` hangs one on each hip (the `_R` twin is mirrored).
# `spritekiln pose specs/kits/pouch.yaml --dirs all` shows it on its host.
kit: pouch
license: CC0-1.0
summary: a leather pouch with a flap hanging from the belt, on the left hip towards the front
host: humanoid
at: pelvis
params:
  width: 0.16        # full width of the bag (world units); it is about as tall (0.16: 4 px at scale 0.04)
  thick: 0.07        # how far the bag stands out from the body (world units)
  angle: 1.0         # where around the waist (radians from the front towards the left, +x): 1.57 is the hip
  radius: 0.2        # distance from the `at` frame's axis (world units): the belt's radius (0.2 on the humanoid)
  y: 0.115           # height of the bag's top above the `at` frame (world units): the belt's lower edge, so it hangs below it
  swing: 0           # the bottom swings outwards by this angle (radians); e.g. "coat*0.3" follows the humanoid's coat
  flap: true         # a lighter flap over the top half of the bag
  stud: false        # a gold stud closing the flap (a pixel or less at 64 px: for bigger sprites)

materials:
  leather: {ramp: bone, bands: [1, 3]}
  dark_leather: {ramp: bone, bands: [1, 2]}   # the bag, a tone below the flap: the lit flap over a darker bag reads
  gold: {ramp: gold, finish: metal}

bones:
  pouch: {parent: at, pos: "[radius*sin(angle), y, radius*cos(angle)]", rot: "[-swing, angle, 0]"}   # local z outwards

parts:
  pouch:
    material: dark_leather
    space: pouch
    prims:                   # a soft bag: rounded bottom corners, rounded front and back edges
      - extrude: {c: "[0, -width/2, thick/2]", depth: thick, round: 0.015,
                  profile: {polygon: ["[-width/2, width/2]", "[width/2, width/2]", "[width/2, -width*0.2]",
                                      "[width*0.275, -width/2]", "[-width*0.275, -width/2]", "[-width/2, -width*0.2]"],
                            round: 0.008}}
  flap:
    material: leather
    space: pouch
    when: flap
    prims:                   # a cap over the bag's top half (front, top and sides) ending in a point
      - extrude: {c: "[0, -width*0.225, thick/2 + 0.006]", depth: "thick + 0.024", round: 0.01,
                  profile: {polygon: ["[-width/2 - 0.01, width*0.25]", "[width/2 + 0.01, width*0.25]",
                                      "[width/2 + 0.01, -width*0.1]", "[0, -width*0.3]", "[-width/2 - 0.01, -width*0.1]"]}}
  stud:
    material: gold
    space: pouch
    when: "flap and stud"
    priority: 2              # the stud closing the flap: one pixel in front of it, it keeps it
    prims:
      - sphere: {c: "[0, -width*0.475, thick + 0.018]", r: 0.022}
