spritekiln: 1
# A kit: parts with params that any spec adds with `use: [{kit: sword, as: sword, at: wrist_R}]`.
# `spritekiln pose specs/kits/sword.yaml --dirs all` shows it on its host.
kit: sword
license: CC0-1.0
summary: a straight one-handed sword held in the fist; the blade rises along the hand frame's y
host: humanoid
at: wrist_R
params:
  length: 0.44       # blade, from the guard to the tip
  width: 0.064       # blade width at the guard
  thick: 0.04        # blade thickness (at least a pixel: 0.04 at scale 0.04)
  guard: 0.15        # cross-guard width (0: no guard)
  tilt: 0.52         # the blade leans forward from the fist (radians about the hand's x)
  roll: 0            # turn about the blade's own axis (1.5708 lays it flat in a side view)
  pitch: 0           # extra lean at the wrist, e.g. a channel such as sword_pitch

materials:
  steel: {ramp: steel, finish: metal}
  leather: {ramp: bone, bands: [1, 3]}

bones:
  sword: {parent: at, pos: [0, 0, 0.035], rot: "[tilt + pitch, 0, 0]"}   # the fist, the blade along its y
  edge: {parent: sword, rot: "[0, roll, 0]"}

parts:
  blade:
    material: steel
    space: edge
    priority: 2              # thin and in front of the body: it keeps its pixels
    prims:
      - extrude: {c: [0, 0, 0], depth: thick, round: 0.006,
                  profile: {polygon: ["[-width/2, 0.09]", "[width/2, 0.09]", "[width*0.42, 0.09 + length*0.86]",
                                      "[0, 0.09 + length]", "[-width*0.42, 0.09 + length*0.86]"]}}
  guard:
    material: steel
    space: edge
    when: "guard > 0"
    prims:
      - extrude: {c: [0, 0.078, 0], depth: 0.045, profile: {rect: "[guard/2, 0.02]", chamfer: 0.01}}
  grip:
    material: leather
    space: edge
    prims:
      - cylinder: {a: [0, -0.045, 0], b: [0, 0.066, 0], r: 0.021}
  pommel:
    material: steel
    space: edge
    prims:
      - sphere: {c: [0, -0.058, 0], r: 0.026}

sockets:
  tip: {bone: edge, offset: "[0, 0.09 + length, 0]"}
  hit: {bone: edge, offset: "[0, 0.09 + length*0.7, 0]"}   # about 0.7 of the blade: where a cut lands
