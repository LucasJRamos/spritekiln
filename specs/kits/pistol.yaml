spritekiln: 1
# A kit: parts with params that any spec adds with `use: [{kit: pistol, as: pistol, at: wrist_R}]`.
# `spritekiln pose specs/kits/pistol.yaml --dirs all` shows it on its host.
kit: pistol
license: CC0-1.0
summary: a flintlock pistol with a flared muzzle, its curved wooden butt in the fist and the barrel along the forearm
host: humanoid
at: wrist_R
host_remove: [use.sword]   # the host template's sword is in the same hand
params:
  length: 0.24       # from the fist to the muzzle (world units)
  thick: 0.07        # barrel diameter (world units; at least a pixel: 0.04 at scale 0.04)
  flare: 0.03        # how much wider the bell of the muzzle is (world units; 0: a straight barrel)
  tilt: 1.1          # lean about the hand's x (radians; 1.1 points the barrel a little down and forward in the template's idle)
  roll: 0            # turn about the barrel (radians; 1.5708 tips the pistol on its side)
  pitch: 0           # extra lean at the wrist (radians; negative raises the muzzle), e.g. a channel such as pistol_pitch
  cheat: 1.3         # strength of the per-direction cheats that turn the weapon's profile to the camera (0: off)
# In a left hand (`at: wrist_L`, or `as: pistol_L`) negate `cheat` so the butt turns out of the body there too.
# The template's attack (a sword slash) does not fit a pistol: it turns it upside down; a host gives it its own clips.

materials:
  iron: {ramp: steel, bands: [1, 3], finish: metal, highlight: {band: 4}}   # dark gun metal with a glint below a blade's brightest
  wood: {ramp: wood, finish: matte, bands: [2, 5]}   # matte: a 1-2 px haft does not flicker with a highlight; tones 2-5 keep it off the dark robe

ramps:   # used only where the host's palette has none of that name
  wood: ["#140c08", "#2f1d13", "#4d3120", "#6d4a2e", "#91683f", "#b88f5c"]

bones:
  pistol: {parent: at, pos: [0, 0, 0.035], rot: "[tilt + pitch, 0, 0]"}   # the fist, the barrel along its y
  # the gun's top (lock, hammer) towards -z. Around s the pistol would face the camera end-on, a short grey bar with
  # the butt buried in the fist: `cheat` turns its side to the camera there, the butt out of the body
  bore: {parent: pistol, rot: "[0, roll - cheat*pulse(yaw*sx, 0, 60), 0]"}

parts:
  barrel:
    material: iron
    space: bore
    priority: 2              # thin and often in front of the body: it keeps its pixels
    blend: 0.01
    prims:
      - cylinder: {a: [0, -0.06, -0.075], b: "[0, length, -0.075]", r: "thick/2"}
      - cone: {a: "[0, length - 0.08, -0.075]", b: "[0, length + 0.01, -0.075]", r: "[thick/2, thick/2 + flare]"}   # the bell muzzle
  stock:                     # the wooden fore-stock under the barrel and the butt curving down and back through the fist
    material: wood
    space: bore
    blend: 0.02
    prims:
      - cylinder: {a: [0, -0.07, -0.042], b: "[0, length*0.53, -0.042]", r: 0.034}
      - tube: {pts: [[0, -0.05, -0.04], [0, -0.06, 0.07], [0, -0.15, 0.19]], r: [0.04, 0.052]}
  lock:                      # the flintlock over the fist, with the hammer's spur at the back
    material: iron
    space: bore
    blend: {mode: chamfer, k: 0.01}
    prims:
      - box: {c: [0, -0.04, -0.062], half: [0.032, 0.055, 0.035], round: 0.008}
      - box: {c: [0, -0.105, -0.105], half: [0.016, 0.022, 0.026], rot: [-0.5, 0, 0], round: 0.006}
  cap:                       # the iron cap on the butt, below the fist
    material: iron
    space: bore
    prims:
      - sphere: {c: [0, -0.158, 0.205], r: 0.048}

sockets:
  muzzle: {bone: bore, offset: "[0, length + 0.04, -0.075]"}   # just ahead of the muzzle: the flash and the shot start here
