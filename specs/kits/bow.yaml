spritekiln: 1
# A kit: parts with params that any spec adds with `use: [{kit: bow, as: bow, at: wrist_L}]`.
# `spritekiln pose specs/kits/bow.yaml --dirs all` shows it on its host.
kit: bow
license: CC0-1.0
summary: a recurve bow held upright by its grip in one fist, the limbs curving away from a taut string
host: humanoid
at: wrist_L
host_remove: [use.sword]   # an archer's other hand draws the arrow: the preview shows the bow alone
params:
  length: 1.2        # tip to tip (world units)
  depth: 0.17        # how far the string stands from the grip (world units; the curve of the limbs)
  thick: 0.07        # limb diameter at the grip, two thirds of it at the tips (world units; at least a pixel: 0.04 at scale 0.04)
  tilt: -0.9         # lean about the hand's x (radians; -0.9 holds it upright in the template's idle, 0.52 points it forward)
  roll: 0.8          # turn about the grip (radians; 0 shows the curve to the front, 1.5708 to the side; negate it in a right hand)
  pitch: 0           # extra lean at the wrist (radians), e.g. a channel such as bow_pitch
  cheat: 1           # strength of the per-direction cheats that turn the weapon's profile to the camera (0: off)
# In a right hand (`at: wrist_R`) negate `roll` and `cheat`: the cheat then works in w instead of e.
# The template's attack (a sword slash) does not fit a bow: it turns it upside down; a host gives it its own clips.

materials:
  wood: {ramp: wood, finish: matte, bands: [2, 5]}   # matte: a 1-2 px haft does not flicker with a highlight; tones 2-5 keep it off the dark robe
  leather: {ramp: bone, bands: [1, 3]}
  string: {ramp: bone, bands: [3, 4], line: false}   # below the limbs' top tone: the bow reads as one D shape

ramps:   # used only where the host's palette has none of that name
  wood: ["#140c08", "#2f1d13", "#4d3120", "#6d4a2e", "#91683f", "#b88f5c"]

bones:
  bow: {parent: at, pos: [0, 0, 0.035], rot: "[tilt + pitch, 0, 0]"}   # the fist, the grip along its y
  # the bow's curve in its x-y plane, the string at -x. In e the rolled bow would show only its string, a 1 px line down
  # the face: `cheat` turns it back to face the front there, where it hides behind the body
  stave: {parent: bow, rot: "[0, roll*(1 - abs(cheat)*pulse(yaw*sx, 90*sign(cheat), 50)), 0]"}

parts:
  limbs:                     # upper and lower limb: bend back towards the string, the tips flick away (recurve)
    material: wood
    space: stave
    blend: 0.02
    prims:
      - tube: {pts: ["[0.02, 0.04, 0]", "[0.05, length*0.25, 0]", "[-depth*0.45, length*0.47, 0]", "[-depth*0.75, length*0.5, 0]",
                     "[-depth*0.7, length*0.53, 0]"], r: "[thick/2, thick/3]"}
      - tube: {pts: ["[0.02, -0.04, 0]", "[0.05, -length*0.25, 0]", "[-depth*0.45, -length*0.47, 0]", "[-depth*0.75, -length*0.5, 0]",
                     "[-depth*0.7, -length*0.53, 0]"], r: "[thick/2, thick/3]"}
  riser:                     # the leather-wrapped grip the fist closes on
    material: leather
    space: stave
    prims:
      - cylinder: {a: [0.01, -0.08, 0], b: [0.01, 0.08, 0], r: "thick/2 + 0.008", round: 0.01}
  string:
    material: string
    space: stave
    priority: 2              # a hairline: it keeps its pixels in front of the body
    min_cover: 1
    prims:
      - cylinder: {a: "[-depth, -length*0.49, 0]", b: "[-depth, length*0.49, 0]", r: 0.012}

sockets:
  nock: {bone: stave, offset: "[-depth, 0, 0]"}   # the middle of the string: an arrow's back end
  rest: {bone: stave, offset: [0.02, 0.07, 0]}     # the arrow rest above the fist: an arrow leaves from here
