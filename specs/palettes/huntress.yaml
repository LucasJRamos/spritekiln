# Huntress palette (ref: D:\GameProjects\tower-hunt\refs\cacadora.png). Index 0 = outline/darkest.
# Used together with gothic.yaml (gold, blood, fx_*). Colors sampled from the splash and hand-tuned
# (hue shift: cool/violet shadows, warm highlights).
ramps:
  pale:     ["#1a0d10", "#5a3234", "#9a6458", "#c8907c", "#e6bba5", "#f8e2d2"]   # fair skin
  blond:    ["#1c0f06", "#5e3a16", "#a06a2a", "#cf9e4a", "#ecc677", "#fbe7a8"]   # golden blond hair
  coatk:    ["#08070b", "#15121a", "#221d28", "#362e3d", "#463b4d", "#5e5066"]   # black coat and hat (cool violet); tone 3 at L* 20
  pantk:    ["#070809", "#121418", "#1e2227", "#2c3238", "#3e464d"]              # black trousers (cool gray)
  bootk:    ["#0b0706", "#1c1210", "#2e1f19", "#463026", "#614536", "#7d5e48"]   # boots and gloves, dark leather
  ivory:    ["#1a130e", "#5a4a3c", "#94806b", "#c2ad92", "#e0d0b8", "#f4ead8"]   # ivory shirt
  vestbr:   ["#120a07", "#33201a", "#4f3326", "#6e4a35", "#8e6748", "#ae8a63"]   # vest, belts and holsters (brown leather)
  gunmetal: ["#08090c", "#14171d", "#22262e", "#343a44", "#4d5561", "#727c88"]   # blackened steel of the guns and the mine
  walnut:   ["#0e0705", "#2a160e", "#432417", "#5e3521", "#7d4b2e", "#9c6640"]   # rifle stock/handguard
  mine_amber: ["#3a1a04", "#a85a0c", "#ffa62a", "#ffd88a", "#fff4d0"]            # unarmed mine light (emissive)
  mine_red:   ["#3a0306", "#a80d18", "#ff2a2a", "#ff8a7a", "#ffe0d8"]            # armed mine light (emissive)
