pxforge: 1
name: templar
kind: character
size: 96                 # larger frame: the Templar is huge and raises the hammer above his head
directions: 8
palette: [../../palettes/gothic.yaml, ../../palettes/templar.yaml]
camera: {pitch: 38, scale: 0.040, center: [0, 1.10, 0]}   # same density as the humanoids (0.040)
shadow: {rx: 15, ry: 5, alpha: 120}

brief:
  summary: huge, sturdy holy knight; authority, brutality and religious fanaticism
  reference: splash.png / splash_alpha.png (~se view, low camera)
  proportions: "≈2.4 tall (human ≈1.75); shoulders 2.2× the hips with huge pauldrons; helm small
    for the body (sells the size); long, thick legs"
  must_keep:
    - dark rectangular (bucket) helm with gold bands in a cross, under a white hood
    - aged white hooded cloak + tabard with a large black cross on the chest
    - dark gray iron armor with huge pauldrons and large gauntlets
    - colossal war hammer in the right hand (block head with gold bands)
    - golden holy light (emissive) in the left hand
  simplify:
    - chain mail, rivets, rope, medallions and pendants are dropped
    - cloak tears become 3-4 notches in the hem
    - the cloak's red lining becomes a strip at the opening
    - magic rays become glow + core (the real light comes from the PointLight2D in Godot)
  palette_notes: [dark neutral iron, cream linen, near-black cross, gold (gothic), blood lining (gothic), leather (bone), emissive holy]
  decisions:
    - black cross on the back of the cloak too (the art only shows the front; helps readability in the n directions)
    - light swings one-handed; heavy two-handed (the light leaves the hand and returns at the end)

materials:
  iron:    {ramp: iron}
  iron_dk: {ramp: iron, bands: [0, 2]}
  linen:   {ramp: linen, bands: [2, 5]}
  cape_linen: {ramp: linen, bands: [1, 4]}   # cloak one tone below the hood/tabard
  lining:  {ramp: blood, bands: [1, 3]}
  cross:   {ramp: crossk, line: false}
  gold:    {ramp: gold, bands: [2, 5]}
  leather: {ramp: bone, bands: [1, 3]}
  holy:    {ramp: holy, emissive: true, band: 2, outline: false, glow: {color: "#ffc845", mix: 0.5, radius: 1}}
  holy_core: {ramp: holy, emissive: true, band: 4, outline: false}
  fx_tail: {ramp: fx_tail, emissive: true}
  fx_mid:  {ramp: fx_mid, emissive: true}
  fx_core: {ramp: fx_core, emissive: true}

channels:
  root: [0, 0, 0]
  bob: 0
  lean: 0.04
  twist: 0
  roll: 0
  squash: 1
  head_pitch: 0
  head_yaw: 0
  hand_L: [0.58, 0.46, 0.30]   # IK in torso_rot space; _R mirrored (x>0 = outward)
  foot_L: [0.18, 0, 0.03]
  pitch_foot_L: 0
  coat: 0          # cloak: + = billows backward
  flap: 0          # tabard flap: + = forward
  ham_pitch: -0.30 # hammer: haft points down (-y) at 0; negative tilts the head forward
  ham_yaw: 0
  ham_roll: 0
  orb: 1           # holy light in the left hand (0 = hidden)
  smite: 0         # holy glow on the hammer head
  holy: 0          # charge aura
  smear_w: 0
  smear_a0: 0
  smear_a1: 0
  smear_r: 1.30
  smear_y: 1.15
  smear_z: 0.05
  smear_fade: 1
  vsm_w: 0         # vertical smear (downward hammer blow)
  vsm_a0: 0
  vsm_a1: 0
  vsm_r: 1.15
  vsm_fade: 1

bones:
  torso_rot: {parent: root, pos: "[0, 1.06 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:  {parent: pelvis, pos: [0, 0.90, 0.03], inherit_rot: false, inherit_scale: false,
              rot: "[lean*0.5, twist, roll]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, 0]"}
  shoulder_L: {parent: pelvis, pos: [0.40, 0.70, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.17, -0.04, 0.0]}
  legyaw:     {parent: root, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: root, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.08, 0]"}
  capebase:   {parent: pelvis, pos: [0, 0.68, -0.08], rot: "[0.05 + coat*0.40 - lean*0.85, -twist*0.4, 0]"}   # cloth hangs by gravity
  flapbase:   {parent: pelvis, pos: [0, 0.04, 0.17], rot: "[-flap - lean*0.8, 0, 0]"}
  hammer:     {parent: torso_rot, pos: "hand_R*[-1, 1, 1]", rot: "[ham_pitch, ham_yaw, ham_roll]"}
  fxspace:    {parent: root, rot: "[0, twist*0.3, 0]"}
  fxv:        {parent: root, rot: [0, 0, 1.5708]}   # arc in the vertical plane (local x = up)

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.42, 0.40],
          pole: [0.4, 0.0, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.10, -0.02]", lengths: [0.53, 0.50],
          pole: [0.1, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:
    material: iron
    space: pelvis
    blend: 0.07
    prims:
      - ellipsoid: {c: [0, 0.08, 0], r: [0.25, 0.17, 0.18]}
      - ellipsoid: {c: [0, 0.34, 0.0], r: [0.27, 0.22, 0.20]}
      - ellipsoid: {c: [0, 0.60, -0.01], r: [0.37, 0.19, 0.22]}
  gorget:
    material: iron
    space: pelvis
    prims:
      - cone: {a: [0, 0.74, 0], b: [0, 0.92, 0.02], r: [0.15, 0.13]}
  tabard:
    material: linen
    space: pelvis
    blend: 0.03
    prims:
      - box: {c: [0, 0.40, 0.17], half: [0.29, 0.33, 0.09], round: 0.05}
      - box: {c: [0, 0.40, -0.14], half: [0.27, 0.33, 0.085], round: 0.05}
  cross_chest:
    material: cross
    space: pelvis
    prims:
      - box: {c: [0, 0.39, 0.262], half: [0.065, 0.32, 0.012]}
      - box: {c: [0, 0.50, 0.262], half: [0.25, 0.06, 0.012]}
  flap:
    material: linen
    space: flapbase
    prims:
      - box: {c: [0, -0.40, 0], half: [0.20, 0.42, 0.03], round: 0.02}
    cut:
      - sphere: {c: [-0.12, -0.84, 0], r: 0.05}
      - sphere: {c: [0.10, -0.86, 0], r: 0.06}
  cross_flap:
    material: cross
    space: flapbase
    prims:
      - box: {c: [0, -0.36, 0.032], half: [0.065, 0.36, 0.01]}
  belt:
    material: leather
    space: pelvis
    prims:
      - cylinder: {a: [0, 0.06, 0], b: [0, 0.13, 0], r: 0.285}
  buckle:
    material: gold
    space: pelvis
    prims:
      - torus: {c: [0, 0.095, 0.29], R: 0.045, r: 0.016, rot: [1.5708, 0, 0]}
  cape:            # thin V shell (outer - inner cone), open at the front, no dome on top
    material: cape_linen
    space: capebase
    prims:
      - cone: {a: [0, 0.0, 0], b: [0, -1.12, -0.06], r: [0.31, 0.39]}
    cut:
      - box: {c: [0, 0.40, 0], half: [1, 0.40, 1]}
      - cone: {a: [0, 0.02, 0.0], b: [0, -1.20, -0.06], r: [0.265, 0.345]}
      - box: {c: [0, -0.8, 0.30], half: [0.9, 1.2, 0.36]}
      - box: {c: [0, -1.60, 0], half: [1, 0.48, 1]}
      - sphere: {c: [0.20, -1.13, -0.36], r: 0.07}
      - sphere: {c: [-0.17, -1.13, -0.37], r: 0.065}
      - sphere: {c: [0.31, -1.13, -0.23], r: 0.06}
  cape_lining:     # red lining inside the shell (2 px)
    material: lining
    space: capebase
    prims:
      - cone: {a: [0, -0.02, 0.0], b: [0, -1.10, -0.06], r: [0.27, 0.35]}
    cut:
      - box: {c: [0, 0.40, 0], half: [1, 0.40, 1]}
      - cone: {a: [0, 0.02, 0.0], b: [0, -1.22, -0.06], r: [0.21, 0.29]}
      - box: {c: [0, -0.8, 0.30], half: [0.9, 1.2, 0.36]}
      - box: {c: [0, -1.52, 0], half: [1, 0.48, 1]}
  cross_back:      # thin layer over the shell, cut to the cross shape
    material: cross
    space: capebase
    prims:
      - cone: {a: [0, 0.0, 0], b: [0, -1.12, -0.06], r: [0.324, 0.404]}
    cut:
      - cone: {a: [0, 0.02, 0.0], b: [0, -1.20, -0.06], r: [0.30, 0.38]}
      - box: {c: [0, 0, 0.5], half: [1, 2, 0.6]}
      - box: {c: [0, 0.59, 0], half: [1, 0.74, 1]}
      - box: {c: [0, -1.60, 0], half: [1, 0.64, 1]}
      - box: {c: [0, -1.60, 0], half: [1, 0.48, 1]}
      - box: {c: [0.74, 0, 0], half: [0.5, 2, 1]}
      - box: {c: [-0.74, 0, 0], half: [0.5, 2, 1]}
      - box: {c: [0.1575, -0.23, 0], half: [0.0825, 0.08, 1]}
      - box: {c: [-0.1575, -0.23, 0], half: [0.0825, 0.08, 1]}
      - box: {c: [0.1575, -0.705, 0], half: [0.0825, 0.255, 1]}
      - box: {c: [-0.1575, -0.705, 0], half: [0.0825, 0.255, 1]}
  capelet:         # short mantle over the cloak (edge at shoulder-blade height)
    material: linen
    space: pelvis
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.72, -0.10], r: [0.32, 0.13, 0.33]}
  pauldron_L:
    material: iron
    prims:
      - ellipsoid: {c: {between: ["@shoulder_L", {between: ["@elbow_L", {at: shoulder_L, off: [0.05, -0.42, 0]}], t: 0.5}], t: 0.12}, r: [0.21, 0.19, 0.23],
                    align: ["@shoulder_L", {between: ["@elbow_L", {at: shoulder_L, off: [0.05, -0.42, 0]}], t: 0.5}]}
  pauldron_trim_L:
    material: gold
    prims:
      - torus: {c: {between: ["@shoulder_L", {between: ["@elbow_L", {at: shoulder_L, off: [0.05, -0.42, 0]}], t: 0.5}], t: 0.45}, R: 0.17, r: 0.03,
                rot: [1.5708, 0, 0], align: ["@shoulder_L", {between: ["@elbow_L", {at: shoulder_L, off: [0.05, -0.42, 0]}], t: 0.5}]}
  arm_L:
    material: iron
    blend: 0.03
    prims:
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.11, 0.095]}
      - sphere: {c: "@elbow_L", r: 0.105}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.10, 0.115]}
  gauntlet_L:
    material: iron
    space: wrist_L
    prims:
      - box: {c: [0, 0, 0.07], half: [0.095, 0.085, 0.095], round: 0.04}
  cuff_L:
    material: gold
    space: wrist_L
    prims:
      - torus: {c: [0, 0, -0.03], R: 0.11, r: 0.018, rot: [1.5708, 0, 0]}
  leg_L:
    material: iron
    blend: 0.03
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.15, 0.115]}
      - sphere: {c: "@knee_L", r: 0.12}
      - cone: {a: "@knee_L", b: "@ankle_L", r: [0.115, 0.095]}
  sabaton_L:
    material: iron
    space: sole_L
    blend: 0.03
    prims:
      - cone: {a: [0, 0.12, 0], b: [0, -0.02, 0.0], r: [0.10, 0.10]}
      - ellipsoid: {c: [0, -0.05, 0.07], r: [0.105, 0.06, 0.18]}
  helm:
    material: iron
    space: head
    prims:
      - box: {c: [0, 0.17, 0.0], half: [0.145, 0.17, 0.15], round: 0.045}
  visor:
    material: iron_dk
    space: head
    prims:
      - box: {c: [0, 0.15, 0.125], half: [0.12, 0.13, 0.03], round: 0.02}
  helm_gold:
    material: gold
    space: head
    prims:
      - box: {c: [0, 0.15, 0.158], half: [0.022, 0.135, 0.01]}
      - box: {c: [0, 0.215, 0.158], half: [0.125, 0.02, 0.01]}
  hood:            # rounded hood draped over the helm (no point)
    material: linen
    space: head
    blend: 0.05
    prims:
      - cone: {a: [0, 0.22, -0.05], b: [0, 0.03, -0.08], r: [0.175, 0.22]}   # bell: round top, base on the shoulders
    cut:
      - box: {c: [0, 0.10, 0.22], half: [0.15, 0.30, 0.20]}
  haft:
    material: leather
    space: hammer
    prims:
      - cylinder: {a: [0, 0.16, 0], b: [0, -0.75, 0], r: 0.042}
  haft_iron:
    material: iron
    space: hammer
    prims:
      - cylinder: {a: [0, -0.69, 0], b: [0, -0.78, 0], r: 0.06}
      - sphere: {c: [0, 0.19, 0], r: 0.055}
  hammer_head:
    material: iron
    space: hammer
    prims:
      - box: {c: [0, -0.95, 0], half: [0.19, 0.17, 0.28], round: 0.03}
  hammer_bands:
    material: gold
    space: hammer
    prims:
      - box: {c: [0, -0.95, 0], half: [0.20, 0.18, 0.03]}
      - box: {c: [0, -0.95, 0], half: [0.20, 0.03, 0.29]}
      - box: {c: [0, -0.95, 0], half: [0.03, 0.18, 0.29]}
  hammer_smite:     # gold bands light up with holy light + striking face
    when: "smite > 0.01"
    material: holy
    space: hammer
    prims:
      - box: {c: [0, -0.95, 0], half: [0.205, 0.185, 0.035]}
      - box: {c: [0, -0.95, 0], half: [0.205, 0.035, 0.295]}
      - box: {c: [0, -0.95, 0], half: [0.035, 0.185, 0.295]}
      - box: {c: [0, -0.95, -0.27], half: [0.17, 0.15, 0.03]}
  orb:
    when: "orb > 0.01"
    material: holy
    space: torso_rot
    prims:
      - sphere: {c: "hand_L + [0.02, 0.21, 0.10]", r: "0.10*orb"}
  orb_core:
    when: "orb > 0.01"
    material: holy_core
    space: torso_rot
    prims:
      - sphere: {c: "hand_L + [0.02, 0.21, 0.15]", r: "0.06*orb"}
  holy_ring:        # ring of holy light in front of the hand (charge)
    when: "holy > 0.01"
    material: holy
    space: torso_rot
    prims:
      - torus: {c: "hand_L + [0.02, 0.21, 0.18]", R: "0.30*holy", r: 0.025, rot: [1.5708, 0, 0]}
  smear:
    when: "smear_w > 0"
    materials: [fx_tail, fx_mid, fx_core]
    space: fxspace
    prims:
      - arc: {c: "[0, smear_y, smear_z]", r: smear_r, a0: smear_a0, a1: smear_a1, width: smear_w, fade: smear_fade, dip: 0.10}
  vsmear:
    when: "vsm_w > 0"
    materials: [fx_tail, fx_mid, fx_core]
    space: fxv
    prims:
      - arc: {c: "[1.25, 0, 0.15]", r: vsm_r, a0: vsm_a0, a1: vsm_a1, width: vsm_w, fade: vsm_fade, dip: -0.18}

timing:                    # timing targets the game tests (validate and QA fail beyond +-1 frame at 60 fps)
  attack_light_a: {hit: 150ms, total: 483ms}
  attack_light_b: {hit: 150ms, total: 483ms}
  attack_heavy: {hit: 500ms, total: 1000ms}

animations:
  # Target timings (attack speed x1) from Hunt Tower's character design document (required animations).
  # The hammer is its own bone in the right hand: ham_pitch/ham_yaw rotate the haft (0 = down).
  idle:
    frames: 8
    ms: 160
    channels:
      bob: "0.03*sin(p) - 0.01"
      squash: "1 + 0.012*sin(p)"
      head_pitch: "-0.03*sin(p - 0.6)"
      hand_L: "[0.58, 0.46 + 0.02*sin(p - 0.7), 0.30]"
      hand_R: "[0.50, 0.10 + 0.015*sin(p - 0.6), 0.10]"
      ham_pitch: "-0.30 + 0.02*sin(p - 0.9)"
      ham_yaw: -0.5
      coat: "0.12*sin(p - 1.0)"
      orb: "1 + 0.12*sin(2*p)"

  run:                     # heavy run; hammer dragged behind
    frames: 8
    ms: 85
    events: {0: step_l, 4: step_r}
    channels:
      lean: 0.16
      bob: "-0.05*cos(2*p) + 0.01"
      squash: "1 - 0.02*cos(2*p)"
      twist: "0.12*cos(p)"
      head_yaw: "-0.06*cos(p)"
      foot_L: "[0.18, 0.16*pos(-sin(p)), 0.04 + 0.38*cos(p)]"
      foot_R: "[0.18, 0.16*pos(sin(p)), 0.04 - 0.38*cos(p)]"
      pitch_foot_L: "0.45*pos(-sin(p))"
      pitch_foot_R: "0.45*pos(sin(p))"
      hand_L: "[0.44, 0.26 + 0.04*pos(cos(p)), 0.22 - 0.16*cos(p)]"
      hand_R: "[0.50, 0.14 + 0.03*cos(2*p), 0.02 + 0.10*cos(p)]"
      ham_pitch: "0.48 + 0.10*sin(2*p)"
      ham_yaw: "0.12*sin(p)"
      coat: "0.45 + 0.25*sin(2*p)"
      flap: "0.12 + 0.12*cos(2*p)"
      orb: "1 + 0.08*sin(2*p)"

  dash:
    loop: false
    keys:
      - {ms: 30, event: release, set: {lean: 0.30, squash: 0.92, bob: -0.05, foot_L: [0.18, 0, 0.22], foot_R: [0.18, 0.06, -0.22],
          hand_R: [0.52, 0.12, -0.10], ham_pitch: 0.6, hand_L: [0.42, 0.30, 0.16], coat: 0.7, flap: 0.2}}
      - {ms: 70, set: {lean: 0.42, squash: 1.05, bob: -0.07, foot_L: [0.18, 0, 0.30], foot_R: [0.18, 0.08, -0.32], pitch_foot_R: 0.6,
          hand_R: [0.52, 0.14, -0.18], ham_pitch: 0.9, hand_L: [0.40, 0.28, 0.12], coat: 1.0, flap: 0.35}}
      - {ms: 50, set: {lean: 0.22, squash: 0.96, bob: -0.05, foot_L: [0.18, 0, 0.20], foot_R: [0.18, 0, -0.18],
          hand_R: [0.52, 0.08, -0.02], ham_pitch: 0.4, hand_L: [0.42, 0.30, 0.24], coat: 0.6, flap: 0.15}}
      - {ms: 60, event: land, set: {lean: 0.08, squash: 0.99, hand_R: [0.50, 0.08, 0.08], ham_pitch: -0.1, coat: 0.25}}

  hurt:
    loop: false
    keys:
      - {ms: 60, set: {lean: -0.22, head_pitch: -0.25, squash: 0.94, bob: -0.04, hand_R: [0.56, 0.14, -0.06], ham_pitch: 0.25,
          hand_L: [0.50, 0.40, 0.10], coat: -0.3, orb: 0.6, flap: -0.1}}
      - {ms: 80, set: {lean: -0.15, head_pitch: -0.15, squash: 0.97, hand_R: [0.54, 0.10, 0.0], ham_pitch: 0.05,
          hand_L: [0.48, 0.34, 0.18], coat: -0.15, orb: 0.8}}
      - {ms: 90, set: {lean: -0.02, head_pitch: -0.04, hand_R: [0.50, 0.10, 0.08], ham_pitch: -0.2}}

  death:                   # falls to his knees leaning on the hammer; the light goes out
    loop: false
    keys:
      - {ms: 110, set: {lean: -0.25, head_pitch: -0.30, squash: 0.93, hand_R: [0.58, 0.12, -0.08], ham_pitch: 0.3,
          hand_L: [0.52, 0.42, 0.08], orb: 0.7, coat: -0.3}}
      - {ms: 140, set: {lean: 0.20, bob: -0.12, head_pitch: 0.15, squash: 0.95, foot_L: [0.18, 0, 0.30], foot_R: [0.18, 0, -0.20],
          hand_R: [0.35, 0.10, 0.30], ham_pitch: -0.2, hand_L: [0.48, 0.20, 0.20], orb: 0.5, coat: 0.3}}
      - {ms: 180, set: {bob: -0.42, lean: 0.25, head_pitch: 0.30, foot_L: [0.20, 0, 0.36], foot_R: [0.18, 0, -0.50], pitch_foot_R: 1.1,
          hand_R: [0.10, 0.62, 0.40], ham_pitch: -0.25, hand_L: [0.02, 0.72, 0.40], orb: 0.4, coat: 0.4, flap: 0.2}}
      - {ms: 200, set: {bob: -0.44, lean: 0.30, head_pitch: 0.45, foot_L: [0.20, 0, 0.36], foot_R: [0.18, 0, -0.50], pitch_foot_R: 1.1,
          hand_R: [0.10, 0.66, 0.39], ham_pitch: -0.30, hand_L: [0.02, 0.76, 0.39], orb: 0.15, coat: 0.35, flap: 0.2}}
      - {ms: 600, event: land, set: {bob: -0.48, lean: 0.40, head_pitch: 0.55, foot_L: [0.20, 0, 0.36], foot_R: [0.18, 0, -0.50],
          pitch_foot_R: 1.1, hand_R: [0.10, 0.75, 0.36], ham_pitch: -0.40, hand_L: [0.02, 0.83, 0.36], orb: 0, coat: 0.3, flap: 0.2}}

  attack_light_a:          # right-to-left hammer swing (one hand). hit at 150 ms, total 483 ms
