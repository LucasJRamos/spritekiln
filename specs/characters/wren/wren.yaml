spritekiln: 1
name: wren
kind: character
view: side                      # profile camera (pitch 0), directions e and w, no ground shadow
mirror: false                   # true renders only e (engines flip it): the sword swaps hands, the light flips
size: 64
palette: [gothic, ../../palettes/wren.yaml]   # gothic for fx_*, steel, gold, flame; wren ramps override
camera: {scale: 0.040, center: [0, 1.08, 0]}   # centre raised from 0.95: the hat clipped the top in jump/rise

# Wren: the example side-scroller character (CC0), built from the side_humanoid template (light chibi
# proportions: head 1.25x; same skeleton, channels and platformer clip set). In profile the silhouette is
# what reads, so the hat brim, the scarf ends, the sword blade and the coat hem are set up for it.
# In `e` the sword arm (right) is the near one, in `w` the far one. Jumps are in place: the game moves the
# character, `root` only nudges the body inside the frame.
brief:
  summary: Wren, a young adventurer for a cozy platformer; light on her feet, curious, a little scruffy
  reference: none (designed from a text brief); profile e/w at 64 px
  proportions: "eyes at ~1.67, hat crown at ~2.0 (~50 px of the 64 px frame); head 1.25x; coat to mid-thigh"
  must_keep:
    - wide, slightly floppy felt hat (the strongest silhouette shape; brim droops at the front, flips up at the back)
    - long warm red-orange scarf, wrapped at the neck, two ends hanging/trailing behind (channel `scarf`)
    - short moss-green travel coat, canvas satchel on the right hip, tall boots with felt cuffs
    - short sword in the right hand (template sword, swordgrip bone, sword_pitch channel)
    - small brass lantern on the back-left of the belt with a warm emissive glow
  simplify:
    - hair reduced to the nape and a fringe under the brim (the crown hides the rest)
    - scarf ends are round chains (a flat ribbon would be edge-on in profile)
    - no buckles or stitching; the belt and the hat band are plain stripes
    - no satchel shoulder strap (in profile it would only retrace the chest outline); the bag hangs from the belt
  palette_notes:
    - "warm and light (the template cloth read at median L* ~16): moss coat, red-orange scarf, brown felt and
      leather, honey hair, fair skin, umber trousers; gold/flame from gothic for the lantern, steel for the sword"
  decisions:
    - "lantern hangs behind the left hip so it sticks out of the back silhouette in both profiles (e and w)"
    - "satchel on the right hip: near side in e, hidden behind the hip in w (the lantern is the w-side detail)"
    - "scarf: 0 = ends hang down the back; 0.5 = diagonal; 1 = streaming straight back (run, fall); > 1 curls
      the tips up. The ends follow the torso's lean (the run's lean already tilts them back). scarf_wave adds a
      ripple travelling along the ends with the clip phase p (0.15-0.3 with scarf ~1 in the run)"
    - "hat on its own bone (hatseat): hat_tilt rocks it (+ over the eyes, e.g. in death lying face up), brim_flop
      droops (+) or flicks up (-) the brim edge for follow-through on jumps and landings"
    - "hat seated high on the head so a pixel of forehead separates the brim from the eye in profile"
    - "lantern, scarf ends and hat are cut at the ground (y = 0) so nothing sinks below the floor when lying down"

materials:
  skin:    {ramp: skin, bands: [2, 5], gamma: 0.7}     # profile faces catch little light: lift them
  coat:    {ramp: coat, bands: [1, 5], gamma: 0.85}
  pants:   {ramp: pants, bands: [1, 4]}
  hair:    {ramp: hair, bands: [2, 5]}
  hat:     {ramp: felt, bands: [2, 5]}
  brim:    {ramp: felt, bands: [1, 4]}    # brim one tone below the crown (separates the two shapes)
  scarf:   {ramp: scarf, bands: [2, 5], gamma: 0.85}   # the accent: keep it saturated, never the dark band
  steel:   {ramp: steel}
  leather: {ramp: leather, bands: [1, 4]}
  canvas:  {ramp: felt, bands: [2, 5]}    # satchel and boot cuffs
  brass:   {ramp: gold, bands: [1, 4]}    # lantern frame
  lantern: {ramp: flame, emissive: true, band: 3, outline: false, glow: {color: "#ffb13b", mix: 0.5, radius: 1}}
  ink:     {ramp: pants, emissive: true, band: 0, outline: false}
  fx_tail: {ramp: fx_tail, emissive: true}
  fx_mid:  {ramp: fx_mid, emissive: true}
  fx_core: {ramp: fx_core, emissive: true}

channels:
  root: [0, 0, 0]
  bob: 0
  lean: 0.05
  twist: 0
  roll: 0
  squash: 1
  head_pitch: 0
  head_yaw: 0
  hand_L: [0.33, 0.06, 0.06]
  foot_L: [0.13, 0, 0.02]
  pitch_foot_L: 0
  coat: 0           # coat hem sway (+ forward, - trailing back)
  scarf: 0          # scarf ends: 0 hang down the back, 0.5 diagonal, 1 stream straight back, > 1 curl up
  scarf_wave: 0     # ripple along the scarf ends, travelling with the clip phase p (0.15-0.3 for a run)
  hat_tilt: 0       # hat rocks on its seat (+ tips the front down over the eyes, - pushes it back)
  brim_flop: 0      # brim edge flop (+ droops, - flicks up); follow-through on jumps and landings
  sword_pitch: 0    # blade rotation at the wrist, in the profile plane (+ = tip toward the forearm)
  smear_w: 0
  smear_a0: 0       # smear angles in the profile plane: 0 = forward, pi/2 = up, -pi/2 = down
  smear_a1: 0
  smear_r: 0.80
  smear_y: 1.15     # arc centre, about the shoulder (root space)
  smear_z: 0.10
  smear_fade: 1

bones:
  torso_rot: {parent: root, pos: "[0, 0.84 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:  {parent: pelvis, pos: [0, 0.70, 0.02], inherit_rot: false, inherit_scale: false,
              rot: "[lean*0.5, twist, roll]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.25}
  hatseat:   {parent: head, pos: [0, 0.255, -0.01], rot: "[hat_tilt, 0, 0]"}   # hat sits high: forehead shows
  shoulder_L: {parent: pelvis, pos: [0.27, 0.55, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.12, -0.02, 0.0]}
  legyaw:     {parent: root, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: root, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.08, 0]"}
  coatbase:   {parent: pelvis, rot: "[-coat*0.25, 0, 0]"}
  # scarf ends: a 4-segment chain from the knot behind the neck (+x rot swings a hanging segment back);
  # `scarf` lifts each segment a little more than the one above, so the ends curl back like a streamer
  scarfknot:  {parent: pelvis, pos: [0.04, 0.60, -0.13], rot: "[0.25 + 1.05*scarf, 0, 0]"}
  scarf_1:    {parent: scarfknot, pos: [0, -0.12, 0], rot: "[-0.10 + 0.25*scarf + scarf_wave*sin(p - 1.2), 0, 0]"}
  scarf_2:    {parent: scarf_1, pos: [0, -0.12, 0], rot: "[-0.05 + 0.20*scarf + scarf_wave*sin(p - 2.4), 0, 0]"}
  scarf_3:    {parent: scarf_2, pos: [0, -0.12, 0], rot: "[-0.10*scarf + scarf_wave*sin(p - 3.6), 0, 0]"}
  scarf_tip:  {parent: scarf_3, pos: [0, -0.12, 0]}
  swordgrip:  {parent: wrist_R, rot: "[sword_pitch, 0, 0]"}   # lets a windup cock the blade back
  # side view: the smear arc turned into the profile plane (vertical slashes read; flat ones are edge-on)
  fxspace:    {parent: root, pos: "[-0.20, smear_y, smear_z]", rot: "[0, 0, pi/2]"}   # x: sword side

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.29, 0.27],
          pole: [0.3, 0.0, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.08, -0.02]", lengths: [0.42, 0.40],
          pole: [0.1, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:
    material: coat
    space: pelvis
    blend: 0.06
    prims:
      - ellipsoid: {c: [0, 0.04, 0], r: [0.19, 0.13, 0.14]}
      - ellipsoid: {c: [0, 0.25, 0.0], r: [0.18, 0.16, 0.13]}
      - ellipsoid: {c: [0, 0.45, 0.0], r: [0.25, 0.16, 0.15]}
  coat:            # short travel coat: open cone from the hip to mid-thigh
    material: coat
    space: coatbase
    blend: 0.03
    prims:
      - cone: {a: [0, 0.05, -0.01], b: [0, -0.32, -0.04], r: [0.20, 0.23]}
    cut:
      - cone: {a: [0, -0.10, 0.20], b: [0, -0.45, 0.30], r: [0.06, 0.16]}   # front opening
      - box: {c: [0, -0.46, 0], half: [0.4, 0.16, 0.4]}   # side view: flat hem at mid-thigh (round reads as a sack)
  belt:
    material: leather
    space: pelvis
    prims:
      - cylinder: {a: [0, 0.10, 0], b: [0, 0.155, 0], r: 0.195}
  satchel:         # canvas bag on the right hip (near side in e), hung from the belt
    material: canvas
    space: pelvis
    prims:
      - box: {c: [-0.215, -0.07, -0.05], half: [0.05, 0.09, 0.11], round: 0.035, rot: [0, 0, -0.12]}
  satchel_flap:
    material: leather
    space: pelvis
    prims:
      - box: {c: [-0.235, -0.015, -0.05], half: [0.035, 0.04, 0.115], round: 0.025, rot: [0, 0, -0.12]}
      - cone: {a: [-0.20, 0.13, -0.05], b: [-0.23, 0.02, -0.05], r: [0.025, 0.025]}   # loop to the belt
  # lantern on the back-left of the belt: sticks out of the back silhouette in both profiles
  lantern_frame:
    material: brass
    space: pelvis
    blend: 0.01
    prims:
      - cone: {a: [0.11, 0.12, -0.18], b: [0.12, 0.05, -0.29], r: [0.022, 0.02]}       # hook from the belt
      - cone: {a: [0.12, 0.055, -0.30], b: [0.12, 0.01, -0.30], r: [0.025, 0.068]}     # cap
      - cylinder: {a: [0.12, -0.12, -0.30], b: [0.12, -0.14, -0.30], r: 0.066}        # base
    cut:   # ground: nothing below y = 0 (lying on the back in death)
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 20}
  lantern_glass:
    material: lantern
    space: pelvis
    prims:
      - cylinder: {a: [0.12, 0.0, -0.30], b: [0.12, -0.115, -0.30], r: 0.058}
    cut:   # ground: nothing below y = 0 (lying on the back in death)
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 20}
  neck:
    material: skin
    space: pelvis
    prims:
      - cone: {a: [0, 0.56, 0], b: [0, 0.70, 0.02], r: [0.07, 0.065]}
  scarf:           # chunky wrap around the neck, knot at the back
    material: scarf
    space: pelvis
    blend: 0.03
    prims:
      - torus: {c: [0, 0.62, 0.015], R: 0.10, r: 0.055, rot: [0.30, 0, 0]}    # +x rot drops the front onto the chest
      - torus: {c: [0, 0.67, 0.02], R: 0.085, r: 0.045, rot: [0.15, 0, 0]}
      - sphere: {c: [0.04, 0.62, -0.12], r: 0.06}
  scarf_ends:      # two ends from the knot: the long one on the bones, the short one offset beside it
    material: scarf
    blend: 0.02
    line: true
    prims:
      - chain: {pts: ["@scarfknot", "@scarf_1", "@scarf_2", "@scarf_3", "@scarf_tip"],
                r: [0.05, 0.046, 0.046, 0.05, 0.056]}
      - chain: {pts: [{at: scarfknot, off: [-0.06, 0, 0]}, {at: scarf_1, off: [-0.06, 0, 0.04]},
                      {at: scarf_2, off: [-0.06, 0.02, 0.07]}, {at: scarf_2, off: [-0.06, -0.08, 0.09]}],
                r: [0.046, 0.044, 0.046, 0.05]}
    cut:   # ground: nothing below y = 0 (lying on the back in death)
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 20}
  head:
    material: skin
    space: head
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.14, 0.0], r: [0.15, 0.16, 0.15]}
      - ellipsoid: {c: [0, 0.07, 0.04], r: [0.11, 0.09, 0.11]}
      - sphere: {c: [0, 0.11, 0.15], r: 0.025}
  hair:            # only what shows under the hat: nape, sides and a fringe
    material: hair
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.15, -0.08], r: [0.158, 0.12, 0.10]}
      - ellipsoid: {c: [0, 0.07, -0.12], r: [0.12, 0.07, 0.06], rot: [0.4, 0, 0]}   # tuft at the nape
      - ellipsoid: {c: [0, 0.205, 0.10], r: [0.13, 0.045, 0.07]}     # fringe under the brim
  hat_crown:       # rounded felt crown, tipped back a little
    material: hat
    space: hatseat
    blend: 0.03
    prims:
      - cylinder: {a: [0, -0.01, 0], b: [0, 0.08, -0.03], r: 0.155, round: 0.05}
    cut:   # ground (r 16 x head scale 1.25 = 20: top at y = 0)
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 16}
  hat_band:
    material: leather
    space: hatseat
    prims:
      - cylinder: {a: [0, -0.005, 0], b: [0, 0.035, -0.01], r: 0.162}
  hat_brim:        # wide floppy brim: droops at the front and the sides, flips up at the back
    material: brim
    space: hatseat
    prims:
      - membrane:
          hub: [0, 0, 0]
          th: 0.035      # world units (not scaled by the head): ~2 px seen edge-on
          # brim_flop > 0 droops the edge (most at the front and back tips), < 0 flicks it up
          ring: ["[0, -0.055 - 0.06*brim_flop, 0.35]", "[0.20, -0.045 - 0.045*brim_flop, 0.27]",
                 "[0.30, -0.05 - 0.03*brim_flop, 0.07]", "[0.29, -0.03 - 0.035*brim_flop, -0.13]",
                 "[0.17, 0.02 - 0.045*brim_flop, -0.26]", "[0, 0.06 - 0.06*brim_flop, -0.31]",
                 "[-0.17, 0.02 - 0.045*brim_flop, -0.26]", "[-0.29, -0.03 - 0.035*brim_flop, -0.13]",
                 "[-0.30, -0.05 - 0.03*brim_flop, 0.07]", "[-0.20, -0.045 - 0.045*brim_flop, 0.27]",
                 "[0, -0.055 - 0.06*brim_flop, 0.35]"]
    cut:   # ground (r 16 x head scale 1.25 = 20: top at y = 0)
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 16}
  eye_L:
    material: ink
    space: head
    prims:
      - sphere: {c: [0.06, 0.105, 0.135], r: 0.04}
  arm_L:
    material: coat
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.085}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.075, 0.06]}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.06, 0.05]}
  hand_L:
    material: skin
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.04], r: 0.055}
  leg_L:
    material: pants
    blend: 0.03
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.095, 0.07]}
      - cone: {a: "@knee_L", b: "@ankle_L", r: [0.07, 0.055]}
  boot_L:
    material: leather
    space: sole_L
    blend: 0.03
    prims:
      - cone: {a: [0, 0.17, -0.005], b: [0, -0.02, 0.0], r: [0.07, 0.066]}   # tall shaft to mid-calf
      - ellipsoid: {c: [0, -0.04, 0.05], r: [0.066, 0.046, 0.115]}
  cuff_L:          # turned-down boot cuff, a lighter felt band
    material: canvas
    space: sole_L
    prims:
      - cylinder: {a: [0, 0.15, -0.005], b: [0, 0.20, -0.008], r: 0.08}
  sword:           # right hand only (no _L => not mirrored)
    material: steel
    space: swordgrip
    prims:         # side view: blade flat and guard turned into the profile plane (edge-on they break up)
      - box: {c: [0, 0.26, 0.19], half: [0.010, 0.24, 0.026], rot: [0.52, 0, 0]}   # tilted blade
      - box: {c: [0, 0.048, 0.068], half: [0.02, 0.013, 0.065], rot: [0.52, 0, 0]}
  grip:
    material: leather
    space: swordgrip
    prims:
      - cylinder: {a: [0, -0.05, 0.01], b: [0, 0.04, 0.06], r: 0.021}
  smear:
    when: "smear_w > 0"
    materials: [fx_tail, fx_mid, fx_core]
    space: fxspace
    prims:
      - arc: {c: [0, 0, 0], r: smear_r, a0: smear_a0, a1: smear_a1, width: smear_w, fade: smear_fade, dip: 0.10}

animations:
  idle:            # ready stance, feet apart so both read in profile
    frames: 6
    ms: 150
    channels:
      bob: "-0.02 + 0.025*sin(p)"
      squash: "1 + 0.015*sin(p)"
      head_pitch: "-0.04*sin(p - 0.5)"
      foot_L: [0.13, 0, 0.12]
      foot_R: [0.13, 0, -0.08]
      hand_L: "[0.33, 0.06 + 0.02*sin(p - 0.6), 0.06]"
      hand_R: "[0.30, 0.10 + 0.02*sin(p - 0.6), 0.16]"
      coat: "0.15*sin(p - 1.0)"
      # overlap: the scarf ends sway behind the coat's phase; the brim lags the bob (droops as the body
      # starts to rise, flicks up as it starts to sink); ~1-2 px each
      scarf: "0.15 + 0.07*sin(p - 1.6)"
      scarf_wave: 0.08
      brim_flop: "-0.4*sin(p - 0.8)"
  run:            # in place; phase warp p + 0.4*(1 - cos p): short stance (~3 frames), long swing
    frames: 8
    ms: 80
    events: {0: step_l, 4: step_r}
    channels:
      lean: "0.30 + 0.03*sin(2*p)"
      bob: "-0.05 - 0.04*sin(2*p)"
      twist: "0.08*cos(p)"
      foot_L: "[0.13, 0.28*pos(-sin(p + 0.4 - 0.4*cos(p))), 0.04 + 0.31*cos(p + 0.4 - 0.4*cos(p))]"
      foot_R: "[0.13, 0.28*pos(sin(p + 0.4 + 0.4*cos(p))), 0.04 - 0.31*cos(p + 0.4 + 0.4*cos(p))]"
      pitch_foot_L: "0.9*pos(-sin(p + 1.0 - 0.4*cos(p)))"
      pitch_foot_R: "0.9*pos(sin(p + 1.0 + 0.4*cos(p)))"
      hand_L: "[0.30, 0.31 - 0.08*cos(p - 0.3), 0.07 - 0.20*cos(p - 0.3)]"
      hand_R: "[0.28, 0.24 + 0.06*cos(p - 0.3), 0.12 + 0.16*cos(p - 0.3)]"
      head_pitch: "-0.18 + 0.03*sin(2*p)"
      coat: "-1.0 + 0.3*sin(2*p - 1.0)"
      # scarf streams back with a ripple (left hanging, the end read as a strap across the back in w);
      # it bounces with the steps; the brim droops just after each contact and flicks up mid-stride
      scarf: "0.9 + 0.08*sin(2*p - 1.2)"
      scarf_wave: 0.28
      brim_flop: "0.15 + 0.45*sin(2*p - 0.6)"
  jump:            # take-off: anticipation crouch (longest key), stretch as the feet leave
    loop: false
    # follow-through: as the body sinks the scarf ends float and the brim flicks up; at the bottom the brim
    # droops; on take-off the ends lag (drop and whip) and the brim droops hard; they swing back in the air
    keys:
      - {ms: 70, set: {bob: -0.10, squash: 0.93, lean: 0.22, head_pitch: 0.05, coat: 0.2,
                       foot_L: [0.13, 0, 0.12], foot_R: [0.13, 0, -0.08],
                       hand_L: [0.30, 0.10, -0.12], hand_R: [0.28, 0.12, -0.02],
                       scarf: 0.35, brim_flop: -0.4}}
      - {ms: 110, set: {bob: -0.18, squash: 0.86, lean: 0.35, head_pitch: 0.12, coat: 0.4,
                        foot_L: [0.13, 0, 0.12], foot_R: [0.13, 0, -0.08],
                        hand_L: [0.30, 0.12, -0.28], hand_R: [0.28, 0.14, -0.20],
                        scarf: 0.2, brim_flop: 0.5}}
      - ms: 80
        event: takeoff
        set: {root: [0, 0.06, 0], bob: 0.04, squash: 1.08, lean: 0.0, head_pitch: -0.15, coat: -0.6,
              foot_L: [0.13, 0.0, 0.06], foot_R: [0.13, 0.0, -0.06], pitch_foot_L: 0.8, pitch_foot_R: 0.8,
              hand_L: [0.30, 0.52, 0.36], hand_R: [0.28, 0.46, 0.36],
              scarf: -0.15, scarf_wave: 0.3, brim_flop: 0.9}
      - {ms: 100, set: {root: [0, 0.06, 0], bob: 0.04, squash: 1.05, lean: 0.10, head_pitch: -0.12, coat: -0.8,
                        foot_L: [0.13, 0.30, 0.12], foot_R: [0.13, 0.12, -0.10], pitch_foot_L: 0.4, pitch_foot_R: 0.7,
                        hand_L: [0.30, 0.62, 0.16], hand_R: [0.28, 0.46, 0.26],
                        scarf: 0.3, scarf_wave: 0.3, brim_flop: 0.5}}
  rise:            # going up: front knee high, arms up (the game picks it while moving up)
    frames: 2
    ms: 100
    channels:
      root: [0, 0.06, 0]
      bob: 0.04
      squash: "1.05 + 0.02*cos(p)"
      lean: 0.10
      head_pitch: -0.12
      foot_L: "[0.13, 0.31 + 0.03*cos(p), 0.13]"
      foot_R: [0.13, 0.12, -0.10]
      pitch_foot_L: 0.4
      pitch_foot_R: "0.7 + 0.1*cos(p)"
      hand_L: "[0.30, 0.62 + 0.04*cos(p), 0.16]"
      hand_R: "[0.28, 0.46 + 0.04*cos(p), 0.26]"
      coat: "-0.8 + 0.4*cos(p)"
      # going up, the air pushes down: the scarf ends trail low and flutter, the brim droops
      scarf: "0.15 + 0.12*cos(p)"
      scarf_wave: 0.3
      brim_flop: "0.45 + 0.2*cos(p)"
