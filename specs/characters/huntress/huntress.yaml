pxforge: 1
name: huntress
kind: character
size: 96                 # 96 frame: rifle aimed e/w + heavy-shot flash do not fit in 64 (see brief)
directions: 8
palette: [../../palettes/gothic.yaml, ../../palettes/huntress.yaml]
camera: {pitch: 38, scale: 0.040, center: [0, 0.95, 0]}   # same density as the humanoids (ADR-017)
shadow: {rx: 9, ry: 3.2, alpha: 120}

brief:
  summary: aristocratic gothic monster huntress (Bloodborne + Victorian gunslinger); young, confident and provocative,
    slender, angular and asymmetric; two long-barreled pistols, rifle for the heavy attack, mine as the special
  reference: "splash.png (copy of D:/GameProjects/tower-hunt/refs/cacadora.png, ~s view, low camera);
    splash_alpha.png = cutout with transparent background and gaps (between the legs, arm/gun);
    splash_alpha_pitch38.png = same cutout with height × cos 38° (how the splash would look in the game camera)"
  proportions: "1.83 tall without the hat (2.02 with it; ~43 px tall on screen); hips at 1.01 (legs = 55% of the
    height, as in the splash); shoulders at 1.46 (0.36 between joints); head 1.2×; hat brim 0.52 wide
    (≈2× the head) and a tall crown"
  must_keep:
    - black hat with a wide asymmetric brim (raised to a point on her left side, wide and low on the right,
      short at the front, gold buckle on the crown) without swallowing the face in the s/se/sw directions
    - short black tailcoat (open at the front, A-line hem, long tails at the back) with wine lining on the lapels,
      on the revers of the opening, inside the hem and in the back vent
    - short wavy golden blond hair (bob) showing under the brim in every direction
    - two long-barreled pistols (blackened steel + gold cylinder and muzzle), one in each hand
    - slender silhouette, long legs, over-the-knee boots (brown leather cuff)
  simplify:
    - brown vest + ivory shirt become one color block on the chest (ivory on top, brown below)
    - buckles, rivets, pendant, high collar, individual cartridges and metal guards are dropped
    - two belts become a brown belt at the waist + a slanted gun belt on the hips, 1-2 px gold buckle
    - ivory puff sleeve becomes 1 dot of color at the elbow; long dark leather gloves up to the elbow
    - boot heel becomes 1 px behind the foot; eyes 1 px; mouth 1 px of wine
  palette_notes: [fair skin (pale), golden blond (blond), violet black of the coat/hat (coatk; brim 1 tone below the crown),
    cool gray trousers (pantk), dark leather of boots/gloves (bootk), brown of vest/belts/holsters (vestbr), ivory (ivory),
    wine lining (blood from gothic), gold (gold from gothic), blackened steel (gunmetal), dark walnut of the rifle (walnut)]
  ref_check: "ref compare --dir s --anim test_ref: IoU 0.560 against splash_alpha.png (theoretical ceiling ~0.56:
    the splash itself flattened by cos 38° scores 0.556 against itself) and 0.651 against splash_alpha_pitch38.png,
    per-band hints ≤ 0.17 (base 0.17; 50-60% 0.15)"
  decisions:
    - "96 px frame (not 64): in the heavy shot (test_rifle_fire) rifle + flash reach 34 px from the center in e/w and 34 px
      above the center in n; at 64 px the limit is 30 (32 - 2 of margin). With the 96 frame ≥19 px are left in every test pose"
    - "height 1.83 (not 1.75): legs lengthened to the splash proportion (legs = 55%). To go back to ~1.75: torso_rot
      at 0.98 and leg_L.lengths [0.46, 0.44]"
    - "rifle (art proposal, not in the splash): ≈1.2 m, blackened steel barrel, dark walnut handguard and stock,
      brass (gold) scope, gold band, butt plate and muzzle. Outside the heavy attack it does NOT appear (it comes
      out of the coat/back in rifle_draw); it does not hang on the back, to keep the silhouette clean"
    - "two leather holsters on the front/outside of the thighs (the splash shows one): empty with the pistols
      in hand; with gun=1 (or mine_X=1 in that side's hand) the pistol grip appears in the holster"
    - "back (not shown in the splash): plain black coat with knee-length tails and a center vent showing the wine lining;
      blond hair visible at the nape below the brim"
    - "per-direction cheat on the hat: with her right side toward the camera (se/e) the front right tip of the brim pulls
      in and lifts (pulse(yaw, 67, 75)), so the face shows in se; in the other directions the brim is the same"
    - "neutral rest pose: pistols low, pointing forward-down and slightly outward (gyaw 0.35), so they read in all 8 directions;
      the splash pose (right pistol raised next to the hat, legs apart) is in test_ref as an idle suggestion"
    - "mine in hand = same disc as the prop specs/props/mine/mine.yaml (amber light)"
    - "pixel-art-director review (fixes 1-8) applied. Deviations from its numbers: coat gamma 1.5 (not 1.2) to
      keep ~30% of the coat in band 2; coatk tone 3 from #322a38 to #362e3d (L* 18.5 -> 20.3: the L* median sticks
      to that tone); revers seated on the measured shell (a [0.059,-0.05,0.121] b [0.130,-0.28,0.120] c [0.212,-0.38,0.014]);
      lapels r [0.032, 0.024] up to y 0.19 (it asked for r [0.026, 0.018] up to 0.25) so the wine exceeds 30 px in se/sw.
      light.rim_strength was not touched (the outline on the shadow side stays visible)"
  animator_notes:
    - "arms: 2-bone IK (0.28 + 0.265) from shoulder to wrist; hand_X in torso_rot space (x>0 = outward); elbow_X =
      elbow pole. The pistol follows the forearm: gpitch_X (negative = barrel up, recoil), gyaw_X (+ = outward)"
    - "aiming with both pistols (run_shoot/shoot_r/shoot_l): hand ≈ [0.11, 0.33, 0.50], elbow ≈ [0.6, -1, -0.3],
      gyaw ≈ 0.05 (test_aim); recoil = gpitch -0.5 + hand back ~0.08 in z; flash flash_X 0..1 (muzzle 0.43 from the wrist)"
    - "rifle: gun=1 enables the rifle and both hands go to rgrip_R/rgrip_L on their own (wrist on the rifle); free_X=1
      frees one hand (e.g. only the right hand pulls the rifle from the back in rifle_draw). Move the rifle with
      rifle_pos/rifle_pitch/rifle_yaw (torso_rot space). Shooting stance: twist -0.6 + rifle_yaw +0.6 (= -twist)
      + head_yaw 0.5 (test_rifle); without the twist the left hand does not reach the handguard. Recoil: negative
      rifle_pitch + smaller rifle_pos z; rflash 0..1"
    - "mine: mine_L=1 puts the mine in the left hand (the left pistol goes to the holster); test_mine = crouched (bob -0.30,
      lean 0.35). The release event of place_mine is when mine_L returns to 0 (the prop appears in the game)"
    - "coat: coat + = hem billows backward (already compensates lean). sgn_L/sgn_R are rifle mirroring helpers: do not animate"
    - "idle: start from test_ref (right pistol raised next to the hat, legs apart) - it is the splash pose"
    - "aim_heavy / shoot_heavy: use rifle_pitch: \"-0.3*pulse(yaw, 0, 70)\" (raises the barrel only near s, where the rifle
      points at the camera and vanishes end-on)"
    - "shooting in s (shoot_r / shoot_l / run_shoot): gyaw ~ +0.15 so the pistol does not point end-on at the camera"
    - "per-direction cheats live in the keys themselves: `yaw` and `dir` work in animation channels (spritekiln 0.1,
      Phase 2). E.g. rifle_pitch: \"-0.08 + -0.2*pulse(yaw, 0, 70)\" raises the barrel only near s; the pistols open
      with gyaw_X: \"0.15 + 0.30*pulse(yaw, 0, 70)\". These used to be the helper channels gyaw_s, rpitch_s and ryaw_s"

materials:
  skin:     {ramp: pale, bands: [2, 5]}
  hair:     {ramp: blond, bands: [2, 5]}
  coat:     {ramp: coatk, bands: [2, 5], gamma: 1.5}   # 1.5 (director: 1.2) to keep ~30% in band 2
  hat:      {ramp: coatk, bands: [2, 5]}
  hat_brim: {ramp: coatk, bands: [1, 4]}   # brim one tone below the crown (separates the two shapes)
  lining:   {ramp: blood, bands: [2, 4], gamma: 0.8}
  vest:     {ramp: vestbr, bands: [1, 4]}
  shirt:    {ramp: ivory, bands: [2, 5]}
  pants:    {ramp: pantk, bands: [2, 4]}
  boot:     {ramp: bootk, bands: [1, 4]}
  glove:    {ramp: bootk, bands: [2, 4]}
  leather:  {ramp: vestbr, bands: [2, 4]}
  gold:     {ramp: gold, bands: [2, 5]}
  gunmetal: {ramp: gunmetal, bands: [2, 5]}
  wood:     {ramp: walnut, bands: [1, 4]}
  ink:      {ramp: coatk, emissive: true, band: 0, outline: false}
  lips:     {ramp: blood, bands: [2, 3], line: false}
  mine_glow: {ramp: mine_amber, emissive: true, band: 2, outline: false, glow: {color: "#ffa62a", mix: 0.5, radius: 1}}
  fx_tail:  {ramp: fx_tail, emissive: true}
  fx_mid:   {ramp: fx_mid, emissive: true}
  fx_core:  {ramp: fx_core, emissive: true}

channels:
  root: [0, 0, 0]
  bob: 0
  lean: 0.03
  twist: 0
  roll: 0
  squash: 1
  head_pitch: 0
  head_yaw: 0
  # arms: IK in torso_rot space; _R channels mirrored (x > 0 = away from the body)
  hand_L: [0.24, 0.06, 0.20]      # hand (wrist) in pistol mode
  elbow_L: [0.35, -0.30, -1.0]    # where the elbow points (pole), torso_rot
  gpitch_L: 0                     # pistol relative to the forearm: 0 = aligned; negative = barrel up (recoil)
  gyaw_L: 0.35                    # pistol turns outward (+) relative to the forearm
  flash_L: 0                      # pistol muzzle flash (0..1)
  mine_L: 0                       # 1 = mine in hand (that hand's pistol goes to the holster)
  foot_L: [0.10, 0, 0.02]
  pitch_foot_L: 0
  coat: 0                         # coat hem: + = billows backward
  # weapons
  gun: 0                          # 0 = pistols in hand | 1 = rifle in hand (pistols holstered)
  free_L: 0                       # with gun=1: 1 frees this hand from the rifle (it follows hand_L again)
  rifle_pos: [-0.03, 0.45, 0.30]  # rifle origin (grip/trigger) in torso_rot space, real coordinate (x>0 = her left);
                                  # designed for the twist -0.6 / rifle_yaw 0.6 stance (test_rifle)
  rifle_pitch: 0                  # + = barrel down
  rifle_yaw: 0.0                  # + = barrel to her left (compensate with -twist to aim forward)
  rifle_roll: 0
  rgrip_R: [0.0, -0.06, -0.05]    # where the right wrist sits on the rifle (rifle space)
  rgrip_L: [0.0, -0.06, 0.26]     # left wrist under the handguard
  rflash: 0                       # rifle muzzle flash (0..1)
  sgn_L: 1                        # mirroring helpers (do not animate)
  sgn_R: -1
  smear_w: 0
  smear_a0: 0
  smear_a1: 0
  smear_r: 0.75
  smear_y: 0.9
  smear_z: 0.15
  smear_fade: 1
  vsm_w: 0                        # (animator) vertical smear of the weapon swap, over the right shoulder (fxr space)
  vsm_a0: 0
  vsm_a1: 0
  vsm_fade: 1

bones:
  torso_rot: {parent: root, pos: "[0, 1.04 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:  {parent: pelvis, pos: [0, 0.50, 0.02], inherit_rot: false, inherit_scale: false,
              rot: "[lean*0.5, twist, roll]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.2}
  shoulder_L: {parent: pelvis, pos: [0.18, 0.42, -0.005]}
  hip_L:      {parent: pelvis, pos: [0.085, -0.03, 0.0]}
  hipout_L:   {parent: hip_L, pos: [0.075, -0.12, 0.03]}           # front/outside of the thigh (holster)
  kneeout_L:  {parent: hip_L, at: knee_L, pos: [0.055, 0.0, 0.03]}
  minehold_L: {parent: root, at: wrist_L, pos: [0.0, -0.07, 0.03]}   # mine in hand: wrist position, always horizontal
  legyaw:     {parent: root, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: root, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.08, 0]"}
  coatbase:   {parent: pelvis, pos: [0, 0.15, 0], rot: "[-coat*0.30 - lean*0.5, 0, 0]"}
  pistolbase_L: {parent: wrist_L, rot: [0, 0, 1.5708]}
  pistol_L:   {parent: pistolbase_L, rot: "[gpitch_L, gyaw_L, 0]"}   # +z = barrel, +y = top of the gun
  rifle:      {parent: torso_rot, pos: "rifle_pos", rot: "[rifle_pitch, rifle_yaw, rifle_roll]"}   # +z = barrel, +y = scope
  fxspace:    {parent: root, rot: "[0, twist*0.3, 0]"}
  fxr:        {parent: torso_rot, pos: [-0.20, 0.47, 0.0], rot: [0, 0, 1.5708]}   # vertical arc at right shoulder (local x = up)

ik:
  # with gun=1 the hand goes to the rifle's rgrip point (the expression already undoes the _R side mirroring)
  arm_L: {start: shoulder_L, space: torso_rot,
          target: "mix(hand_L, v(sgn_L, 1, 1)*(rifle_pos + roty(rifle_yaw) @ rotz(rifle_roll) @ rotx(rifle_pitch) @ rgrip_L), clamp(gun, 0, 1)*(1 - free_L))",
          lengths: [0.28, 0.265], pole: "elbow_L", pole_space: torso_rot, up: [1, 0, 0], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.10, -0.03]", lengths: [0.49, 0.47],
          pole: [0.1, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  # ---------------- body ----------------
  hips:
    material: pants
    space: pelvis
    prims:
      - ellipsoid: {c: [0, 0.0, 0], r: [0.145, 0.10, 0.105]}
  vest:
    material: vest
    space: pelvis
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.16, 0.0], r: [0.105, 0.11, 0.085]}
      - ellipsoid: {c: [0, 0.31, 0.0], r: [0.13, 0.11, 0.095]}
  shirt:
    material: shirt
    space: pelvis
    prims:
      - ellipsoid: {c: [0, 0.37, 0.042], r: [0.09, 0.08, 0.078]}
  coat_torso:
    material: coat
    space: pelvis
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.31, -0.012], r: [0.152, 0.13, 0.115]}
      - ellipsoid: {c: [0, 0.18, -0.01], r: [0.122, 0.085, 0.102]}
      - ellipsoid: {c: [0, 0.405, -0.01], r: [0.195, 0.06, 0.108]}
    cut:
      - cone: {a: [0, 0.11, 0.165], b: [0, 0.47, 0.15], r: [0.05, 0.12]}
  coat_torso_lining:   # wine lining: inner shell with a narrower V -> thin red line at the opening
    material: lining
    space: pelvis
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.31, -0.012], r: [0.148, 0.126, 0.111]}
      - ellipsoid: {c: [0, 0.18, -0.01], r: [0.118, 0.081, 0.098]}
      - ellipsoid: {c: [0, 0.405, -0.01], r: [0.191, 0.056, 0.104]}
    cut:
      - cone: {a: [0, 0.11, 0.165], b: [0, 0.47, 0.15], r: [0.05, 0.12]}
  lapel_L:         # lapel with the wine lining turned outward, on the edge of the V
    material: lining
    space: pelvis
    prims:
      - cone: {a: [0.10, 0.43, 0.08], b: [0.03, 0.19, 0.098], r: [0.032, 0.024]}
  collar:
    material: coat
    space: pelvis
    prims:
      - cone: {a: [0, 0.42, -0.04], b: [0, 0.53, -0.06], r: [0.082, 0.068]}
    cut:
      - box: {c: [0, 0.5, 0.06], half: [0.2, 0.2, 0.06]}
  belt:
    material: leather
    space: pelvis
    prims:
      - cylinder: {a: [0, 0.095, 0], b: [0, 0.137, 0], r: 0.117}
  gunbelt:
    material: leather
    space: pelvis
    prims:
      - torus: {c: [0, 0.02, 0.0], R: 0.142, r: 0.02, rot: [0.12, 0, -0.16]}
  buckle:
    material: gold
    space: pelvis
    prims:
      - box: {c: [0, 0.116, 0.119], half: [0.026, 0.021, 0.01]}
  coat_skirt:      # coat hem: cone shell open at the front, vent at the back
    material: coat
    space: coatbase
    prims:
      - cone: {a: [0, 0.0, -0.01], b: [0, -0.56, -0.03], r: [0.13, 0.24]}
    cut:
      - cone: {a: [0, 0.02, -0.01], b: [0, -0.60, -0.03], r: [0.112, 0.22]}
      - box: {c: [0, 0.25, 0], half: [1, 0.25, 1]}
      - box: {c: [0, -0.76, 0], half: [1, 0.30, 1], rot: [-0.55, 0, 0]}
      - cone: {a: [0, 0.02, 0.20], b: [0, -0.50, 0.32], r: [0.05, 0.28]}
      - cone: {a: [0, -0.06, -0.15], b: [0, -0.50, -0.25], r: [0.012, 0.09]}
  coat_lining:     # wine lining inside the hem
    material: lining
    space: coatbase
    prims:
      - cone: {a: [0, -0.01, -0.01], b: [0, -0.55, -0.03], r: [0.112, 0.221]}
    cut:
      - cone: {a: [0, 0.01, -0.01], b: [0, -0.60, -0.03], r: [0.095, 0.202]}
      - box: {c: [0, 0.25, 0], half: [1, 0.25, 1]}
      - box: {c: [0, -0.76, 0], half: [1, 0.30, 1], rot: [-0.55, 0, 0]}
      - cone: {a: [0, 0.02, 0.21], b: [0, -0.50, 0.33], r: [0.035, 0.25]}
  coat_revers_L:   # lining face turned outward on the edge of the hem opening (seated on the shell, ~0.02 above the hem)
    material: lining
    space: coatbase
    prims:
      - tri: {a: [0.059, -0.05, 0.121], b: [0.130, -0.28, 0.120], c: [0.212, -0.38, 0.014], th: 0.014}
  neck:
    material: skin
    space: pelvis
    prims:
      - cone: {a: [0, 0.43, 0.0], b: [0, 0.53, 0.015], r: [0.046, 0.041]}

  # ---------------- head ----------------
  head:
    material: skin
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.12, 0], r: [0.108, 0.122, 0.112]}
      - ellipsoid: {c: [0, 0.065, 0.035], r: [0.08, 0.07, 0.085]}
      - sphere: {c: [0, 0.025, 0.07], r: 0.034}
      - sphere: {c: [0, 0.095, 0.112], r: 0.016}
  eye_L:
    material: ink
    space: head
    prims:
      - sphere: {c: [0.042, 0.115, 0.098], r: 0.02}
  lips:
    material: lips
    space: head
    prims:
      - box: {c: [0, 0.045, 0.097], half: [0.022, 0.008, 0.012]}
  hair:
    material: hair
    space: head
    blend: 0.035
    prims:
      - ellipsoid: {c: [0, 0.165, -0.015], r: [0.122, 0.085, 0.125]}
      - ellipsoid: {c: [0, 0.095, -0.055], r: [0.122, 0.105, 0.085]}
      - ellipsoid: {c: [0.095, 0.075, -0.03], r: [0.042, 0.075, 0.06]}
      - ellipsoid: {c: [-0.098, 0.07, -0.03], r: [0.045, 0.08, 0.06]}
      - ellipsoid: {c: [-0.12, 0.03, -0.045], r: [0.04, 0.04, 0.07], rot: [0, 0, 0.5]}
      - ellipsoid: {c: [-0.03, 0.18, 0.085], r: [0.085, 0.03, 0.03], rot: [0.4, 0, 0.35]}
  hat_crown:
    material: hat
    space: head
    blend: 0.02
    prims:
      - cylinder: {a: [0, 0.20, -0.015], b: [0, 0.35, -0.04], r: 0.092, round: 0.015}
  hat_brim:        # wide asymmetric brim: drooping on her right, raised on the left, short at the front
    material: hat_brim
    space: head
    prims:
      - membrane:
          hub: [0, 0.215, -0.03]
          th: 0.012
          # per-direction cheat: with her right side turned to the camera (se/e) the front right tip
          # pulls in and lifts, so the brim does not cover the face (weight ~0.8 in se/e, ~0 in s/ne/n/w)
          ring: ["[0.02, 0.24 + 0.02*pulse(yaw, 67, 75), 0.19 - 0.03*pulse(yaw, 67, 75)]", [0.15, 0.30, 0.12], [0.17, 0.40, -0.02],
                 [0.15, 0.31, -0.16], [0.0, 0.22, -0.26], [-0.19, 0.205, -0.17],
                 "[-0.28 + 0.04*pulse(yaw, 67, 75), 0.225 + 0.03*pulse(yaw, 67, 75), -0.02]",
                 "[-0.17 + 0.05*pulse(yaw, 67, 75), 0.205 + 0.05*pulse(yaw, 67, 75), 0.17 - 0.04*pulse(yaw, 67, 75)]",
                 "[0.02, 0.24 + 0.02*pulse(yaw, 67, 75), 0.19 - 0.03*pulse(yaw, 67, 75)]"]
  hat_buckle:
    material: gold
    space: head
    prims:
      - box: {c: [0.065, 0.27, 0.06], half: [0.026, 0.022, 0.01], rot: [0, 0.85, 0]}

  # ---------------- arms ----------------
  sleeve_L:
    material: coat
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.068}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.058, 0.048]}
  puff_L:
    material: shirt
    prims:
      - sphere: {c: {between: ["@elbow_L", "@wrist_L"], t: 0.08}, r: 0.064}
  glove_L:
    material: glove
    blend: 0.02
    prims:
      - cone: {a: {between: ["@elbow_L", "@wrist_L"], t: 0.2}, b: "@wrist_L", r: [0.046, 0.037]}
      - sphere: {c: {at: wrist_L, off: [0, 0, 0.035]}, r: 0.042}

  # ---------------- legs ----------------
  thigh_L:
    material: pants
    blend: 0.03
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.08, 0.056]}
  boot_L:
    material: boot
    blend: 0.03
    prims:
      - cone: {a: {between: ["@knee_L", "@hip_L"], t: 0.22}, b: "@knee_L", r: [0.072, 0.064]}
      - cone: {a: "@knee_L", b: "@ankle_L", r: [0.06, 0.044]}
  bootcuff_L:      # leather cuff at the top of the tall boot
    material: leather
    prims:
      - torus: {c: {between: ["@knee_L", "@hip_L"], t: 0.20}, R: 0.074, r: 0.024, rot: [1.5708, 0, 0],
                align: ["@knee_L", "@hip_L"]}
  bootfoot_L:
    material: boot
    space: sole_L
    blend: 0.02
    prims:
      - ellipsoid: {c: [0, -0.06, 0.055], r: [0.044, 0.036, 0.11]}
      - cone: {a: [0, -0.02, -0.035], b: [0, -0.08, -0.045], r: [0.03, 0.02]}
  holster_L:       # leather holster on the thigh (always visible; empty in pistol mode)
    material: leather
    prims:
      - cone: {a: "@hipout_L", b: {between: ["@hipout_L", "@kneeout_L"], t: 0.55}, r: [0.04, 0.03]}
  holstered_L:     # grip of the holstered pistol (rifle in hand, or mine in this hand)
    when: "gun >= 0.5 or mine_L >= 0.5"
    material: gunmetal
    prims:
      - cone: {a: {at: hipout_L, off: [0.005, 0.0, 0.0]}, b: {at: hipout_L, off: [0.012, 0.075, 0.05]}, r: [0.028, 0.024]}
  holstered_gold_L:
    when: "gun >= 0.5 or mine_L >= 0.5"
    material: gold
    prims:
      - sphere: {c: {at: hipout_L, off: [0.006, 0.02, 0.014]}, r: 0.027}

  # ---------------- pistols (gun = 0) ----------------
  pistol_L:
    when: "gun < 0.5 and mine_L < 0.5"
    material: gunmetal
    space: pistol_L
    blend: 0.01
    prims:
      - box: {c: [0, 0.035, 0.06], half: [0.016, 0.028, 0.05], round: 0.008}
      - cylinder: {a: [0, 0.042, 0.10], b: [0, 0.042, 0.43], r: 0.018}
  pistol_gold_L:
    when: "gun < 0.5 and mine_L < 0.5"
    material: gold
    space: pistol_L
    prims:
      - cylinder: {a: [0, 0.04, 0.045], b: [0, 0.04, 0.10], r: 0.026}
      - cylinder: {a: [0, 0.042, 0.405], b: [0, 0.042, 0.43], r: 0.022}
  pistol_grip_L:
    when: "gun < 0.5 and mine_L < 0.5"
    material: wood
    space: pistol_L
    prims:
      - box: {c: [0, -0.01, 0.01], half: [0.015, 0.045, 0.02], rot: [0.35, 0, 0], round: 0.008}
  flash_L:
    when: "flash_L > 0.01 and gun < 0.5"
    material: fx_mid
    space: pistol_L
    prims:
      - ellipsoid: {c: [0, 0.042, 0.50], r: "[0.05*flash_L, 0.05*flash_L, 0.08*flash_L]"}
  flash_core_L:
    when: "flash_L > 0.01 and gun < 0.5"
    material: fx_core
    space: pistol_L
    prims:
      - sphere: {c: [0, 0.042, 0.48], r: "0.03*flash_L"}

  # ---------------- mine in hand (place_mine) ----------------
  minehand_L:      # same mine as the `mine` prop (0.38 m disc)
    when: "mine_L >= 0.5"
    material: gunmetal
    space: minehold_L
    blend: 0.02
    prims:
      - cylinder: {a: [0, -0.03, 0], b: [0, 0.02, 0], r: 0.19, round: 0.015}
      - ellipsoid: {c: [0, 0.02, 0], r: [0.12, 0.035, 0.12]}
  minehand_gold_L:
    when: "mine_L >= 0.5"
    material: gold
    space: minehold_L
    prims:
      - torus: {c: [0, 0.03, 0], R: 0.15, r: 0.026}
  minehand_light_L:
    when: "mine_L >= 0.5"
    material: mine_glow
    space: minehold_L
    prims:
      - sphere: {c: [0, 0.07, 0], r: 0.05}

  # ---------------- rifle (gun = 1) ----------------
  rifle_metal:
    when: "gun >= 0.5"
    material: gunmetal
    space: rifle
    blend: 0.01
    prims:
      - box: {c: [0, 0.0, 0.08], half: [0.022, 0.03, 0.10], round: 0.01}
      - cylinder: {a: [0, 0.012, 0.16], b: [0, 0.012, 0.88], r: 0.018}
  rifle_wood:
    when: "gun >= 0.5"
    material: wood
    space: rifle
    blend: 0.02
    prims:
      - cone: {a: [0, -0.03, -0.02], b: [0, -0.05, -0.16], r: [0.024, 0.032]}
      - box: {c: [0, -0.055, -0.22], half: [0.022, 0.048, 0.085], rot: [-0.12, 0, 0], round: 0.015}
      - box: {c: [0, -0.02, 0.32], half: [0.02, 0.022, 0.14], round: 0.012}
  rifle_gold:
    when: "gun >= 0.5"
    material: gold
    space: rifle
    prims:
      - cylinder: {a: [0, 0.058, 0.0], b: [0, 0.058, 0.28], r: 0.016}
      - box: {c: [0, -0.06, -0.305], half: [0.024, 0.05, 0.01], rot: [-0.12, 0, 0]}
      - torus: {c: [0, 0.008, 0.50], R: 0.022, r: 0.009, rot: [1.5708, 0, 0]}
      - cylinder: {a: [0, 0.012, 0.855], b: [0, 0.012, 0.885], r: 0.024}
  rflash:
    when: "rflash > 0.01 and gun >= 0.5"
    material: fx_mid
    space: rifle
    prims:
      - ellipsoid: {c: [0, 0.012, 1.04], r: "[0.12*rflash, 0.12*rflash, 0.22*rflash]"}
  rflash_core:
    when: "rflash > 0.01 and gun >= 0.5"
    material: fx_core
    space: rifle
    prims:
      - sphere: {c: [0, 0.012, 0.96], r: "0.075*rflash"}

  rsmear:          # vertical smear of the weapon swap (like the templar's vsmear), in the right shoulder plane
    when: "vsm_w > 0"
    materials: [fx_tail, fx_mid, fx_core]
    space: fxr
    prims:
      - arc: {c: [0, 0, 0], r: 0.85, a0: vsm_a0, a1: vsm_a1, width: vsm_w, fade: vsm_fade, dip: 0}

  smear:
    when: "smear_w > 0"
    materials: [fx_tail, fx_mid, fx_core]
    space: fxspace
    prims:
      - arc: {c: "[0, smear_y, smear_z]", r: smear_r, a0: smear_a0, a1: smear_a1, width: smear_w, fade: smear_fade, dip: 0.10}

timing:                    # timing targets the game tests (validate and QA fail beyond +-1 frame at 60 fps)
  shoot_r: {release: 2f, total: 7f}
  shoot_l: {release: 2f, total: 7f}
  shoot_heavy: {release: 0f, total: 200ms}
  place_mine: {release: 100ms, total: 167ms}
  dash: {total: 160ms}
  hurt: {total: 150ms}

sockets:                   # attachment points exported per frame and direction (spritekiln 0.1, Phase 2)
  muzzle_L: {bone: pistol_L, offset: [0, 0.042, 0.50], when: "gun < 0.5 and mine_L < 0.5"}   # muzzle = flash center
  muzzle_rifle: {bone: rifle, offset: [0, 0.012, 1.04], when: "gun >= 0.5"}                   # rifle muzzle (flash center)
  hand_L: {bone: wrist_L}
  mine_L: {bone: minehold_L, offset: [0, 0.02, 0], when: "mine_L >= 0.5"}                     # center of the held mine
  foot_L: {bone: ankle_L}

animations:
  # Target timings (60 fps, attack speed x1) in D:\GameProjects\tower-hunt\docs\design\personagens.md
  # (Huntress / required animations). Event = sum of the previous frames' durations (±1 f).
  # Runs match the game speed (0.040 u/px): the planted foot moves back 1 table step per frame.
  #   run:       0.364 u / 70 ms = 5.2 u/s = 130 px/s
  #   run_shoot: 0.312 u / 75 ms = 4.16 u/s = 104 px/s (x0.8)
  # per-direction cheats: `yaw`/`dir` work in channels (e.g. rifle_pitch: "-0.08 + -0.2*pulse(yaw, 0, 70)").

  idle:                    # splash pose (test_ref): right pistol raised next to the hat, left one low
    frames: 8
    ms: 150
    channels:
      bob: "0.03*sin(p) - 0.03"
      squash: "1 + 0.01*sin(p)"
      roll: 0.04
      head_yaw: -0.35
      head_pitch: "0.05 - 0.025*sin(p - 0.7)"
      hand_R: "[0.36, 0.55 + 0.02*sin(p - 0.6), -0.07]"
      elbow_R: [0.6, -1.0, 0.0]
      gyaw_R: 0.0
      gpitch_R: "0.06*sin(p - 1.0)"
      hand_L: "[0.30, -0.13 + 0.015*sin(p - 0.5), 0.05]"
      gyaw_L: 0.45
      gpitch_L: "0.05*sin(p - 0.9)"
      foot_L: [0.35, 0, 0.05]
      foot_R: [0.10, 0, 0.0]
      coat: "0.06 + 0.07*sin(p - 1.1)"

  run:                     # nimble run, pistols low; 3 stance frames + 1 flight frame per step
    frames: 8
    ms: 70
    events: {0: step_l, 4: step_r}
    channels:
      lean: 0.15
      bob: "-0.06 - 0.03*sin(2*p)"
      squash: "1 - 0.02*sin(2*p)"
      twist: "0.10*cos(p)"
      roll: "-0.035*sin(p + 0.8)"      # torso leans toward the planted foot (L in f0-2; sign measured)
      head_yaw: "-0.06*cos(p)"
      head_pitch: "-0.04 + 0.02*sin(2*p - 0.6)"
      foot_L: "[0.16, [0, 0, 0, 0.08, 0.24, 0.22, 0.12, 0.04][f], [0.394, 0.03, -0.334, -0.425, -0.225, 0.085, 0.358, 0.467][f]]"
      foot_R: "[0.16, [0, 0, 0, 0.08, 0.24, 0.22, 0.12, 0.04][(f + 4) % 8], [0.394, 0.03, -0.334, -0.425, -0.225, 0.085, 0.358, 0.467][(f + 4) % 8]]"
      pitch_foot_L: "[0.0, 0.05, 0.45, 0.75, 0.95, 0.45, 0.1, -0.1][f]"
      pitch_foot_R: "[0.0, 0.05, 0.45, 0.75, 0.95, 0.45, 0.1, -0.1][(f + 4) % 8]"
      hand_L: "[0.22, 0.08 + 0.07*pos(-cos(p - 0.3)), 0.10 - 0.18*cos(p - 0.3)]"
      hand_R: "[0.22, 0.08 + 0.07*pos(cos(p - 0.3)), 0.10 + 0.18*cos(p - 0.3)]"
      gpitch_L: 0.2
      gpitch_R: 0.2
      coat: "0.55 + 0.22*sin(2*p - 1.2)"

  run_shoot:               # running with both pistols aimed forward (the flash comes from the game)
    frames: 8
    ms: 75
    events: {0: step_l, 4: step_r}
    channels:
      lean: 0.08
      bob: "-0.05 - 0.02*sin(2*p)"
      squash: "1 - 0.012*sin(2*p)"
      twist: "0.03*cos(p)"
      head_pitch: 0.05
      foot_L: "[0.16, [0, 0, 0, 0.06, 0.19, 0.18, 0.10, 0.03][f], [0.342, 0.03, -0.282, -0.36, -0.189, 0.077, 0.311, 0.405][f]]"
      foot_R: "[0.16, [0, 0, 0, 0.06, 0.19, 0.18, 0.10, 0.03][(f + 4) % 8], [0.342, 0.03, -0.282, -0.36, -0.189, 0.077, 0.311, 0.405][(f + 4) % 8]]"
      pitch_foot_L: "[0.0, 0.05, 0.4, 0.65, 0.8, 0.4, 0.1, -0.1][f]"
      pitch_foot_R: "[0.0, 0.05, 0.4, 0.65, 0.8, 0.4, 0.1, -0.1][(f + 4) % 8]"
      hand_L: [0.15, 0.33, 0.50]
      hand_R: [0.15, 0.33, 0.50]
      elbow_L: [0.6, -1.0, -0.3]
      elbow_R: [0.6, -1.0, -0.3]
      gyaw_L: "0.15 + 0.30*pulse(yaw, 0, 70)"
      gyaw_R: "0.15 + 0.30*pulse(yaw, 0, 70)"
      coat: "0.40 + 0.15*sin(2*p - 1.2)"

  shoot_r:                 # light shot, right hand. release at 33 ms (2 f), total 117 ms (7 f)
    loop: false
    keys:
      - {ms: 33, set: &aim {hand_L: [0.15, 0.33, 0.50], hand_R: [0.15, 0.33, 0.50], elbow_L: [0.6, -1.0, -0.3], elbow_R: [0.6, -1.0, -0.3],
          gyaw_L: "0.15 + 0.30*pulse(yaw, 0, 70)", gyaw_R: "0.15 + 0.30*pulse(yaw, 0, 70)", lean: 0.08,
          foot_L: [0.11, 0, 0.12], foot_R: [0.10, 0, -0.08], coat: 0.05}}
      - {ms: 33, event: release, set: {<<: *aim, hand_R: [0.16, 0.35, 0.44], gpitch_R: -0.2, flash_R: 1, twist: -0.04, head_pitch: -0.02, coat: 0.1}}
      - {ms: 25, set: {<<: *aim, hand_R: [0.16, 0.37, 0.42], gpitch_R: -0.42, twist: -0.05, head_pitch: -0.03, coat: 0.12}}
      - {ms: 26, set: {<<: *aim, hand_R: [0.15, 0.345, 0.47], gpitch_R: -0.18, twist: -0.02, coat: 0.08}}

  shoot_l:                 # mirror of shoot_r (same feet: alternating shots do not make the feet jump)
    loop: false
    keys:
      - {ms: 33, set: *aim}
      - {ms: 33, event: release, set: {<<: *aim, hand_L: [0.16, 0.35, 0.44], gpitch_L: -0.2, flash_L: 1, twist: 0.04, head_pitch: -0.02, coat: 0.1}}
      - {ms: 25, set: {<<: *aim, hand_L: [0.16, 0.37, 0.42], gpitch_L: -0.42, twist: 0.05, head_pitch: -0.03, coat: 0.12}}
      - {ms: 26, set: {<<: *aim, hand_L: [0.15, 0.345, 0.47], gpitch_L: -0.18, twist: 0.02, coat: 0.08}}

  dash:                    # 160 ms: low push-off, skimming flight, landing; coat streams back
    loop: false
    keys:
      - {ms: 33, event: release, set: {lean: 0.35, squash: 0.92, bob: -0.12, head_pitch: -0.12,
          foot_L: [0.20, 0, 0.30], foot_R: [0.18, 0.05, -0.30], pitch_foot_R: 0.6,
          hand_L: [0.24, 0.02, -0.10], hand_R: [0.24, 0.02, -0.10], gpitch_L: 0.4, gpitch_R: 0.4, coat: 0.8}}
      - {ms: 50, set: {lean: 0.50, squash: 1.04, bob: -0.16, head_pitch: -0.22,
          foot_L: [0.20, 0.10, 0.34], foot_R: [0.18, 0.18, -0.40], pitch_foot_L: -0.1, pitch_foot_R: 0.9,
          hand_L: [0.32, 0.04, -0.20], hand_R: [0.32, 0.04, -0.20], gpitch_L: 0.5, gpitch_R: 0.5, coat: 1.15}}
      - {ms: 44, set: {lean: 0.38, squash: 1.0, bob: -0.14, head_pitch: -0.15,
          foot_L: [0.20, 0.02, 0.28], foot_R: [0.18, 0.08, -0.32], pitch_foot_R: 0.6,
          hand_L: [0.32, 0.04, -0.08], hand_R: [0.32, 0.04, -0.08], gpitch_L: 0.35, gpitch_R: 0.35, coat: 0.95}}
      - {ms: 33, event: land, set: {lean: 0.18, squash: 0.95, bob: -0.08, head_pitch: -0.05,
          foot_L: [0.11, 0, 0.18], foot_R: [0.10, 0, -0.16], pitch_foot_R: 0.3,
          hand_L: [0.24, 0.05, 0.10], hand_R: [0.24, 0.05, 0.10], gpitch_L: 0.15, gpitch_R: 0.15, coat: 0.5}}

  hurt:                    # 150 ms: short recoil, arms open, coat swings forward
    loop: false
    keys:
      - {ms: 50, set: {lean: -0.25, squash: 0.94, bob: -0.04, twist: 0.10, head_pitch: -0.30, head_yaw: 0.15,
          hand_L: [0.32, 0.20, 0.0], hand_R: [0.34, 0.16, -0.05], gpitch_L: -0.3, gpitch_R: -0.3,
          foot_L: [0.11, 0, 0.06], foot_R: [0.10, 0, -0.12], coat: -0.35}}
      - {ms: 50, set: {lean: -0.14, squash: 0.97, bob: -0.02, twist: 0.05, head_pitch: -0.15, head_yaw: 0.08,
          hand_L: [0.28, 0.12, 0.08], hand_R: [0.29, 0.10, 0.05], gpitch_L: -0.15, gpitch_R: -0.15,
          foot_L: [0.11, 0, 0.06], foot_R: [0.10, 0, -0.12], coat: -0.15}}
      - {ms: 50, set: {lean: -0.03, head_pitch: -0.04, hand_L: [0.25, 0.07, 0.17], hand_R: [0.25, 0.07, 0.16],
          foot_L: [0.11, 0, 0.04], foot_R: [0.10, 0, -0.06], coat: 0.05}}

  death:                   # recoils from the blow, falls to her knees and topples face down; land = body on the ground
    # turns (twist 0.9) as she falls: lies diagonal on screen in s/n/e/w (without the turn she was end-on to the camera
    # in s); only sw stays end-on. The feet follow the turn (computed from the twist of the same key)
    loop: false
    keys:
      - {ms: 100, set: {lean: -0.30, squash: 0.93, bob: -0.03, twist: 0.15, head_pitch: -0.35, head_yaw: 0.2,
          hand_L: [0.34, 0.20, -0.02], hand_R: [0.36, 0.16, -0.06], gpitch_L: -0.3, gpitch_R: -0.3,
          foot_L: [0.11, 0, 0.06], foot_R: [0.10, 0, -0.14], coat: -0.35}}
      - {ms: 110, set: {lean: 0.12, squash: 0.96, bob: -0.24, twist: 0.08, head_pitch: 0.20,
          hand_L: [0.27, -0.10, 0.12], hand_R: [0.28, -0.08, 0.10], gpitch_L: 0.5, gpitch_R: 0.5,
          foot_L: [0.11, 0, 0.20], foot_R: [0.10, 0, -0.14], pitch_foot_R: 0.3, coat: 0.2}}
      - {ms: 130, set: {lean: 0.28, squash: 0.97, bob: -0.50, twist: 0.35, head_pitch: 0.30,
          hand_L: [0.25, -0.12, 0.16], hand_R: [0.26, -0.10, 0.14], gpitch_L: 0.6, gpitch_R: 0.6,
          foot_L: "[0.11*cos(twist) - 0.42*sin(twist), 0, -0.11*sin(twist) - 0.42*cos(twist)]",
          foot_R: "[0.10*cos(twist) + 0.45*sin(twist), 0, 0.10*sin(twist) - 0.45*cos(twist)]",
          pitch_foot_L: 1.3, pitch_foot_R: 1.3, coat: 0.25}}
      - {ms: 110, set: {lean: 0.90, squash: 0.98, bob: -0.66, twist: 0.70, head_pitch: -0.10,
          hand_L: [0.26, 0.20, 0.42], hand_R: [0.30, 0.42, 0.12], gpitch_L: 0.2, gpitch_R: 0.2,
          foot_L: "[0.11*cos(twist) - 0.62*sin(twist), 0, -0.11*sin(twist) - 0.62*cos(twist)]",
          foot_R: "[0.10*cos(twist) + 0.66*sin(twist), 0, 0.10*sin(twist) - 0.66*cos(twist)]",
          pitch_foot_L: 1.4, pitch_foot_R: 1.4, coat: 0.4}}
      - {ms: 100, event: land, set: {lean: 1.45, squash: 0.92, bob: -0.88, twist: 0.90,
          head_pitch: 0.55, head_yaw: 0.25,
          hand_L: [0.30, 0.52, 0.10], hand_R: [0.26, 0.48, 0.12], gpitch_L: 0.0, gpitch_R: 0.0,
          foot_L: "[0.13*cos(twist) - 0.84*sin(twist), 0, -0.13*sin(twist) - 0.84*cos(twist)]",
          foot_R: "[0.08*cos(twist) + 0.86*sin(twist), 0, 0.08*sin(twist) - 0.86*cos(twist)]",
          pitch_foot_L: 1.45, pitch_foot_R: 1.45, coat: 0.35}}
      - {ms: 420, set: {lean: 1.48, squash: 1.0, bob: -0.88, twist: 0.90,
          head_pitch: 0.62, head_yaw: 0.3,
          hand_L: [0.32, 0.54, 0.10], hand_R: [0.27, 0.50, 0.12], gpitch_L: 0.05, gpitch_R: 0.05,
          foot_L: "[0.13*cos(twist) - 0.84*sin(twist), 0, -0.13*sin(twist) - 0.84*cos(twist)]",
          foot_R: "[0.08*cos(twist) + 0.86*sin(twist), 0, 0.08*sin(twist) - 0.86*cos(twist)]",
          pitch_foot_L: 1.45, pitch_foot_R: 1.45, coat: 0.3}}

  rifle_draw:              # 250 ms: pistols holstered, draws the rifle from the back (gun 0->1 on frame 1, hand behind
                           # the body) and brings it over the right shoulder (vertical smear rsmear) up to aim
    loop: false
    keys:
      - {ms: 40, set: {lean: 0.05, bob: -0.03, twist: -0.10, head_yaw: 0.1,
          hand_L: [0.18, -0.08, 0.10], hand_R: [0.18, -0.08, 0.10], elbow_L: [0.5, -0.2, -1.0], elbow_R: [0.5, -0.2, -1.0],
          gyaw_L: 0.1, gyaw_R: 0.1, foot_L: [0.12, 0, 0.12], foot_R: [0.12, 0, -0.10], coat: 0.1}}
      - {ms: 50, set: {gun: 1, free_L: 1, lean: 0.04, bob: -0.04, twist: -0.30, head_yaw: 0.25,
          hand_L: [0.20, -0.06, 0.10], rifle_pos: [-0.22, 0.10, -0.12], rifle_yaw: -2.7, rifle_pitch: 0.5,
          elbow_R: [1.0, -0.6, -0.4], foot_L: [0.12, 0, 0.16], foot_R: [0.12, 0, -0.13], coat: 0.15}}
      - {ms: 40, set: &over_shoulder {gun: 1, free_L: 1, lean: 0.05, bob: -0.02, twist: -0.50, head_yaw: 0.40,
          hand_L: [0.12, 0.40, 0.24], rifle_pos: [-0.22, 0.47, 0.0], rifle_yaw: -0.2, rifle_pitch: -1.2,
          elbow_R: [1.0, -0.6, 0.0], foot_L: [0.12, 0, 0.18], foot_R: [0.12, 0, -0.14], coat: 0.25,
          vsm_w: 0.07, vsm_a0: 3.5, vsm_a1: 1.8, vsm_fade: 0.7}}
      - {ms: 60, set: {gun: 1, twist: -0.62, rifle_yaw: "0.72 + -0.35*pulse(yaw, 0, 70)", rifle_pitch: "0.10 + -0.2*pulse(yaw, 0, 70)", head_yaw: 0.45, head_pitch: 0.08,
          lean: 0.05, elbow_R: [1.0, -0.6, 0.0], elbow_L: [0.2, -1.0, 0.0],
          foot_L: [0.12, 0, 0.18], foot_R: [0.12, 0, -0.14], pitch_foot_R: 0.1, coat: 0.12,
          vsm_w: 0.05, vsm_a0: 1.8, vsm_a1: 0.3, vsm_fade: 0.5}}
      - {ms: 60, set: &rifle_aim {gun: 1, twist: -0.6, rifle_yaw: "0.6 + -0.35*pulse(yaw, 0, 70)", rifle_pitch: "0.0 + -0.2*pulse(yaw, 0, 70)", head_yaw: 0.5, head_pitch: 0.1,
          lean: 0.06, elbow_R: [1.0, -0.6, 0.0], elbow_L: [0.2, -1.0, 0.0],
          foot_L: [0.12, 0, 0.18], foot_R: [0.12, 0, -0.14], pitch_foot_R: 0.1}}

  aim_heavy:               # standing still aiming the rifle; minimal breathing, barrel almost still
    frames: 4
    ms: 200
    channels:
      <<: *rifle_aim
      bob: "0.03*sin(p) - 0.01"
      squash: "1 + 0.008*sin(p)"
      coat: "0.04 + 0.05*sin(p - 1.0)"
      head_pitch: "0.1 + 0.015*sin(p - 0.8)"

  shoot_heavy:             # release on frame 0 (strong flash), big shoulder and torso recoil, recovery. 200 ms
    loop: false
    keys:
      - {ms: 33, event: release, set: {<<: *rifle_aim, rflash: 1, rifle_pitch: "-0.08 + -0.2*pulse(yaw, 0, 70)", lean: 0.0,
          rifle_pos: [-0.03, 0.46, 0.27]}}
      - {ms: 33, set: {<<: *rifle_aim, rflash: 0.4, rifle_pitch: "-0.40 + -0.2*pulse(yaw, 0, 70)", rifle_pos: [-0.03, 0.49, 0.19],
          lean: -0.14, twist: -0.72, bob: -0.02, head_pitch: -0.06, coat: -0.15}}
      - {ms: 50, set: {<<: *rifle_aim, rifle_pitch: "-0.22 + -0.2*pulse(yaw, 0, 70)", rifle_pos: [-0.03, 0.47, 0.24],
          lean: -0.06, twist: -0.66, bob: -0.01, head_pitch: 0.02, coat: -0.05}}
      - {ms: 84, set: {<<: *rifle_aim, rifle_pitch: "-0.05 + -0.2*pulse(yaw, 0, 70)", lean: 0.04, coat: 0.03}}

  rifle_holster:           # 200 ms: rifle rises over the shoulder and returns to the back, draws the pistols
                           # (gun 1->0 on frame 2) and ends in the pose of idle frame 0 (seamless join); interruptible
    loop: false
    keys:
      - {ms: 50, set: {<<: *over_shoulder, vsm_w: 0.06, vsm_a0: 0.1, vsm_a1: 1.6, vsm_fade: 0.7}}
      - {ms: 50, set: {gun: 1, free_L: 1, lean: 0.04, bob: -0.03, twist: -0.25, head_yaw: 0.2,
          hand_L: [0.18, -0.10, 0.10], rifle_pos: [-0.22, 0.08, -0.14], rifle_yaw: -2.7, rifle_pitch: 0.6,
          elbow_R: [1.0, -0.6, -0.4], foot_L: [0.12, 0, 0.14], foot_R: [0.12, 0, -0.12], coat: 0.15,
          vsm_w: 0.05, vsm_a0: 1.6, vsm_a1: 3.4, vsm_fade: 0.6}}
      - {ms: 50, set: {lean: 0.05, bob: -0.03, twist: -0.06, head_yaw: 0.05,
          hand_L: [0.18, -0.08, 0.12], hand_R: [0.18, -0.08, 0.12], elbow_L: [0.5, -0.2, -1.0], elbow_R: [0.5, -0.2, -1.0],
          gyaw_L: 0.15, gyaw_R: 0.15, foot_L: [0.12, 0, 0.10], foot_R: [0.12, 0, -0.08], coat: 0.1}}
      - {ms: 50, set: {bob: -0.03, roll: 0.04, head_yaw: -0.35, head_pitch: 0.066,
          hand_R: [0.36, 0.54, -0.07], elbow_R: [0.6, -1.0, 0.0], gyaw_R: 0.0, gpitch_R: -0.05,
          hand_L: [0.30, -0.14, 0.05], gyaw_L: 0.45, gpitch_L: -0.04,
          foot_L: [0.35, 0, 0.05], foot_R: [0.10, 0, 0.0], coat: 0.0}}

  place_mine:              # 167 ms: deep crouch, the mine touches the ground between the feet, lets go (release at
                           # 100 ms = 6 f, mine_L back to 0 and the pistol back in hand) and stands up.
                           # The arm points down in world space
    loop: false
    keys:
      - {ms: 33, set: {mine_L: 1, bob: -0.20, lean: 0.30, head_pitch: -0.05, hand_L: [0.12, 0.0, 0.40], hand_R: [0.28, 0.08, 0.14],
          foot_L: [0.12, 0, 0.16], foot_R: [0.11, 0, -0.14], pitch_foot_R: 0.3, coat: 0.2}}
      - {ms: 33, set: {mine_L: 1, bob: -0.42, lean: 0.62, head_pitch: -0.18, hand_L: [0.05, 0.0, 0.46], hand_R: [0.30, 0.10, 0.08],
          foot_L: [0.12, 0, 0.22], foot_R: [0.11, 0, -0.24], pitch_foot_R: 0.8, coat: 0.35}}
      - {ms: 34, set: {mine_L: 1, bob: -0.55, lean: 0.85, head_pitch: -0.28, hand_L: [0.05, 0.02, 0.45], hand_R: [0.31, 0.12, 0.05],
          foot_L: [0.12, 0, 0.24], foot_R: [0.11, 0, -0.28], pitch_foot_R: 1.1, coat: 0.4}}
      - {ms: 33, event: release, set: {mine_L: 0, bob: -0.52, lean: 0.80, head_pitch: -0.25, hand_L: [0.12, 0.04, 0.42], gpitch_L: 0.5,
          hand_R: [0.31, 0.12, 0.05], foot_L: [0.12, 0, 0.24], foot_R: [0.11, 0, -0.28], pitch_foot_R: 1.1, coat: 0.38}}
      - {ms: 34, set: {bob: -0.24, lean: 0.38, head_pitch: -0.08, hand_L: [0.25, 0.0, 0.26], gpitch_L: 0.2, hand_R: [0.27, 0.08, 0.15],
          foot_L: [0.12, 0, 0.16], foot_R: [0.11, 0, -0.12], pitch_foot_R: 0.3, coat: 0.15}}
