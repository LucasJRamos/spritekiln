[project]
name = "spritekiln"
version = "0.1.0"
description = "SDF 3D -> pixel art animada em 8 direções"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10.0", "pyyaml>=6.0"]

[project.optional-dependencies]
splash = ["rembg[cpu]"]
dev = ["pytest>=8"]

[project.scripts]
spritekiln = "spritekiln.cli:main"
pxforge = "pxforge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spritekiln", "pxforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: long renders (showcase reproduction); run with `pytest -m slow`",
]
