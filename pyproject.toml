[project]
name = "pxforge"
version = "0.1.0"
description = "SDF 3D -> pixel art animada em 8 direções"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10.0", "pyyaml>=6.0"]

[project.optional-dependencies]
splash = ["rembg[cpu]"]

[project.scripts]
pxforge = "pxforge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pxforge"]
